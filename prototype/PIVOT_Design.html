<script>
/* Date-scoped sharing: only explicitly selected records enter the export. */
const flexKinds=[['workout','Workouts only'],['food','Food only'],['progress','Progress'],['overall','Overall summary']];
const flexMetrics={workout:[['sessions','Sessions'],['duration','Duration'],['volume','Lifting volume'],['sets','Sets'],['distance','Distance'],['energy','Active calories']],food:[['meals','Meals'],['kcal','Food calories'],['protein','Protein'],['carbs','Carbs'],['fat','Fat']],progress:[['body','Selected measurements']],overall:[['sessions','Sessions'],['duration','Activity minutes'],['volume','Lifting volume'],['distance','Distance'],['meals','Meals'],['kcal','Food calories'],['protein','Protein'],['carbs','Carbs'],['fat','Fat'],['body','Latest selected measurement']]};
const flexDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:iso(new Date(v));
function flexInit(kind='workout',id=''){const d=newStory(kind,id);d.flex=true;d.period='today';d.start=iso(TODAY);d.end=iso(TODAY);d.selected=null;d.title='';d.stats={name:false,body:false};const defaults={workout:['sessions','duration','volume','sets'],food:['meals','kcal','protein','carbs','fat'],progress:[],overall:['sessions','duration','meals','kcal','protein']};for(const k of defaults[kind]||[])d.stats[k]=true;if(id){const r=kind==='food'?S.meals.find(x=>x.id===id):kind==='progress'?W.measurements.find(x=>x.id===id):HISTORY.find(x=>x.id===id);if(r){d.period='day';d.start=d.end=flexDate(r.date);d.selected=[(kind==='food'?'m:':kind==='progress'?'p:':'w:')+id];}}return d;}
function flexRange(d){if(d.period==='today')return [iso(TODAY),iso(TODAY)];if(d.period==='week'){const monday=addDays(TODAY,-((TODAY.getDay()+6)%7));return [iso(monday),iso(TODAY)];}return [d.start,d.period==='day'?d.start:d.end];}
function flexValid(d){const [a,b]=flexRange(d);return /^\d{4}-\d{2}-\d{2}$/.test(a)&&/^\d{4}-\d{2}-\d{2}$/.test(b)&&Number.isFinite(+new Date(a))&&Number.isFinite(+new Date(b))&&a<=b;}
function flexRecords(d){if(!flexValid(d))return [];const [a,b]=flexRange(d);let records=[];if(['workout','overall'].includes(d.kind))records.push(...HISTORY.map(h=>({key:'w:'+h.id,group:'workout',label:h.name,date:flexDate(h.date),raw:h})));if(['food','overall'].includes(d.kind))records.push(...S.meals.map(m=>({key:'m:'+m.id,group:'food',label:m.name,date:flexDate(m.date),raw:m})));if(['progress','overall'].includes(d.kind))records.push(...W.measurements.map(m=>({key:'p:'+m.id,group:'progress',label:m.name,date:m.date,raw:m})));return records.filter(r=>r.date>=a&&r.date<=b).sort((x,y)=>y.date.localeCompare(x.date));}
function flexSelected(d){return flexRecords(d).filter(r=>d.selected===null?(r.group!=='progress'||d.kind==='progress'):d.selected.includes(r.key));}
function flexPeriodLabel(d){const [a,b]=flexRange(d);return a===b?a:a+' — '+b;}
const originalStoryModel=storyModel;
storyModel=d=>{if(!d.flex)return originalStoryModel(d);const records=flexSelected(d),workouts=records.filter(r=>r.group==='workout').map(r=>r.raw),meals=records.filter(r=>r.group==='food').map(r=>r.raw),measurements=records.filter(r=>r.group==='progress').map(r=>r.raw),stats=[];const sum=(items,k)=>items.reduce((n,r)=>n+(Number(r[k])||0),0);const push=(key,value,label,available=true)=>{if(d.stats[key]&&available)stats.push([String(Math.round(value*10)/10),label]);};push('sessions',workouts.length,'SESSIONS',workouts.length>0);push('duration',sum(workouts,'min'),'ACTIVITY · MIN',workouts.length>0);push('volume',sum(workouts,'vol'),'VOLUME · KG',workouts.some(h=>h.sets>0));push('sets',sum(workouts,'sets'),'SETS',workouts.some(h=>h.sets>0));push('distance',sum(workouts,'km'),'DISTANCE · KM',workouts.some(h=>h.km!=null));push('energy',sum(workouts,'kcal'),'LOGGED ACTIVE KCAL',workouts.some(h=>h.kcal!=null));push('meals',meals.length,'MEALS',meals.length>0);push('kcal',sum(meals,'kcal'),'FOOD · KCAL',meals.length>0);push('protein',sum(meals,'p'),'PROTEIN · G',meals.length>0);push('carbs',sum(meals,'c'),'CARBS · G',meals.length>0);push('fat',sum(meals,'f'),'FAT · G',meals.length>0);if(d.stats.body)for(const m of measurements.slice(0,d.kind==='overall'?1:6))stats.push([String(m.value),m.name.toUpperCase()+' · '+m.unit.toUpperCase()]);const sample=workouts.some(h=>h.sample);const title=d.title.trim()||(records.length===1?records[0].label:{workout:'The work adds up.',food:'Fuel for my progress.',progress:'My progress. My pace.',overall:'A little better, every day.'}[d.kind]);return {title,kicker:{today:'TODAY',week:'THIS WEEK',day:'MY DAY',custom:'MY RECAP'}[d.period]+' / '+{workout:'TRAINING',food:'NUTRITION',progress:'PROGRESS',overall:'MY PIVOT'}[d.kind],stats:stats.slice(0,6),foot:flexPeriodLabel(d)+(sample?' · Includes sample activity':' · Selected logs only'),name:d.stats.name?W.profile.name:'',sample};};
const singleStoryRoute=ROUTES.find(r=>r.pattern==='/share/story').fn;
route('/share/single',singleStoryRoute);
replaceRoute('/share/story',()=>{if(!storyDraft?.flex)storyDraft=flexInit(flexKinds.some(([k])=>k===storyDraft?.kind)?storyDraft.kind:'workout',storyDraft?.id||'');const d=storyDraft,records=flexRecords(d),selected=flexSelected(d),keys=new Set(selected.map(r=>r.key));return {html:page('Story studio',`<div class="p-main-grid"><div class="p-main-col"><div class="p-card"><div class="p-label">YOUR STORY, YOUR WAY</div><h2 class="mt12">Share the part that matters.</h2><p class="note mt12">Choose a day, a week, or your own range. Totals use only your selected logs. Demo “today”: ${iso(TODAY)}.</p><div class="field"><span>1 · Period</span><div class="chips" style="padding:0;flex-wrap:wrap">${[['today','Today'],['day','Specific day'],['week','This week'],['custom','Custom range']].map(([k,l])=>`<button class="chip" data-act="flexPeriod" data-period="${k}" aria-pressed="${d.period===k}">${l}</button>`).join('')}</div></div>${['day','custom'].includes(d.period)?`<div class="grid2">${field('flex-start',d.period==='day'?'Date':'From',d.start,'date')}${d.period==='custom'?field('flex-end','Through',d.end,'date'):''}</div>${button('flexDates','Apply dates')}`:''}<p class="small mt12">${esc(flexPeriodLabel(d))}${d.period==='week'?' · Monday to demo today':''}</p><div class="field"><span>2 · Content</span><div class="chips" style="padding:0;flex-wrap:wrap">${flexKinds.map(([k,l])=>`<button class="chip" data-act="flexKind" data-kind="${k}" aria-pressed="${d.kind===k}">${l}</button>`).join('')}</div></div><div class="field"><span>3 · Choose records · ${selected.length} selected</span><div class="btn-row">${button('flexSelectAll','Select visible records')} ${button('flexSelectNone','Clear selection')}</div><div style="max-height:310px;overflow:auto;margin-top:12px">${records.map(r=>`<label class="row" style="gap:12px"><input type="checkbox" data-flex-record="${esc(r.key)}" ${keys.has(r.key)?'checked':''}><span class="row__t"><b>${esc(r.label)}</b><span>${r.date} · ${r.group}${r.raw.sample?' · Sample':''}${r.group==='progress'?' · Private measurement':''}</span></span></label>`).join('')||empty('No records in this period. Try another date or log something first.')}</div></div><div class="field"><span>4 · Visible stats · up to six</span><div class="chips" style="padding:0;flex-wrap:wrap">${flexMetrics[d.kind].map(([k,l])=>`<button class="chip" data-act="flexStat" data-key="${k}" aria-pressed="${!!d.stats[k]}">${d.stats[k]?'✓ ':''}${l}</button>`).join('')}${storyToggle('name','My name')}</div></div>${field('flex-title','Card title (optional)',d.title)}${button('flexTitle','Apply title')}<div class="field"><span>5 · Style</span><div class="chips" style="padding:0">${['dark','light','acid'].map(s=>`<button class="chip" data-act="storyStyle" data-style="${s}" aria-pressed="${d.style===s}">${s}</button>`).join('')}</div></div><label class="field"><span>Photo (optional; hidden until selected)</span><select class="input" id="story-photo"><option value="">No progress photo</option>${W.photos.map(p=>`<option value="${p.id}" ${d.photo===p.id?'selected':''}>${p.date}</option>`).join('')}</select></label><label class="field"><span>Or upload a background</span><input class="input" id="story-background" type="file" accept="image/jpeg,image/png,image/webp"></label>${d.photo||d.background?button('storyClearPhoto','Remove photo'):''}<p class="note mt16">Private body values and photos stay hidden unless selected. Progress cards show up to six selected measurements; overall cards show only the latest selected measurement when enabled. Missing days are not assumed to be zero.</p><a class="link mt16" href="#/share/single" data-act="flexSingle">Personal best & milestone cards</a></div></div><aside class="p-aside"><div class="p-card"><canvas id="story-canvas" width="1080" height="1920" aria-label="PIVOT Story preview" style="width:100%;max-width:360px;aspect-ratio:9/16;border-radius:16px;display:block;margin:auto"></canvas><p id="story-status" class="small mt12" role="status">Preparing preview…</p><div class="btn-row mt16"><button class="btn p sm" id="story-share" data-act="storyShare" disabled>Share image</button><button class="btn s sm" id="story-save" data-act="storySave" disabled>Save PNG</button></div><p class="note mt12">1080 × 1920 · PIVOT watermark. Choose Instagram if offered by your device, or save the PNG and add it to your Story.</p></div></aside></div>`,'/profile'),mount:renderStory};});
function flexResetSelection(){storyDraft.selected=null;storyFile=null;render();}
ACT.flexPeriod=t=>{storyDraft.period=t.dataset.period;flexResetSelection();};
ACT.flexKind=t=>{const old=storyDraft,d=flexInit(t.dataset.kind);d.period=old.period;d.start=old.start;d.end=old.end;d.style=old.style;storyDraft=d;storyFile=null;render();};
ACT.flexDates=()=>{const a=val('flex-start'),b=storyDraft.period==='day'?a:val('flex-end'),d={...storyDraft,start:a,end:b};if(!flexValid(d))return toast('Choose valid dates with the end on or after the start');storyDraft.start=a;storyDraft.end=b;flexResetSelection();};
ACT.flexSelectAll=()=>{storyDraft.selected=flexRecords(storyDraft).map(r=>r.key);storyFile=null;render();};ACT.flexSelectNone=()=>{storyDraft.selected=[];storyFile=null;render();};
ACT.flexStat=t=>{const k=t.dataset.key,enabled=Object.entries(storyDraft.stats).filter(([key,v])=>v&&key!=='name').length;if(!storyDraft.stats[k]&&enabled>=6)return toast('Choose up to six stats for a readable card');storyDraft.stats[k]=!storyDraft.stats[k];storyFile=null;render();};
ACT.flexTitle=()=>{storyDraft.title=val('flex-title').slice(0,90);storyFile=null;render();};
ACT.flexSingle=()=>{storyDraft=newStory('pr');storyFile=null;go('/share/single');};
document.addEventListener('change',e=>{if(!storyDraft?.flex||!e.target.dataset.flexRecord)return;const key=e.target.dataset.flexRecord,keys=new Set(flexSelected(storyDraft).map(r=>r.key));if(e.target.checked)keys.add(key);else keys.delete(key);storyDraft.selected=[...keys];storyFile=null;render();});
const flexRenderPrevious=renderStory;
renderStory=async()=>{if(storyDraft?.flex&&(!flexValid(storyDraft)||!flexSelected(storyDraft).length)){storyRevision++;storyFile=null;drawStory($('#story-canvas'),storyDraft);$('#story-status').textContent='Choose at least one recorded item to create a Story.';$('#story-save').disabled=true;$('#story-share').disabled=true;return;}return flexRenderPrevious();};
ACT.storyOpen=t=>{const kind=t.dataset.kind||'workout';storyDraft=['pr','milestone'].includes(kind)?newStory(kind,t.dataset.id||''):flexInit(kind,t.dataset.id||'');storyFile=null;storyImage=null;go(storyDraft.flex?'/share/story':'/share/single');};
for(const path of ['/food','/food/meal/:id']){const previous=ROUTES.find(r=>r.pattern===path).fn;replaceRoute(path,(p,q)=>{const out=previous(p,q),entry=`<section class="pad mt16">${button('storyOpen',path==='/food'?'Share food Story':'Share this meal',`data-kind="food" ${p?.id?'data-id="'+p.id+'"':''}`,'p')}</section>`;return typeof out==='string'?out+entry:{...out,html:out.html+entry};});}
const flexHomePrevious=ROUTES.find(r=>r.pattern==='/').fn;
replaceRoute('/',(p,q)=>{const out=flexHomePrevious(p,q);out.html+=`<section class="p-card mt24">${pCardHead('Your day, worth sharing')}${button('storyOpen','Create my recap','data-kind="overall"','p')}</section>`;return out;});
render();

</script>
<script>
/* Coach workspace: shared local records, saved drafts, explicit assignment review. */
W.coach=W.coach||{profiles:{},customRoster:[],drafts:{},assignments:[],archivedTemplates:{}};
const C=W.coach;
C.customRoster.forEach(a=>{if(!ROSTER.some(r=>r.id===a.id))ROSTER.push(a);});
for(const a of ROSTER)C.profiles[a.id]=C.profiles[a.id]||{group:'',archived:false,notes:''};
let cs={query:'',filter:'active',group:'all',selected:[],draftId:null,sessionId:null,assignment:null,templateQuery:''};
const csDay=()=>iso(nowFlow());
const csActive=id=>!!person(id)&&!C.profiles[id]?.archived&&(id!=='hassan'||W.connected);
const csScopeBefore=scopeOn;
scopeOn=(id,sc)=>csActive(id)&&csScopeBefore(id,sc);
const csNav=(active='')=>`<nav class="cs-nav" aria-label="Coach tools">${[['/coach','Overview'],['/coach/athletes','Athletes'],['/coach/plans','Programs'],['/coach/reviews','Check-ins'],['/coach/messages','Messages'],['/coach/gym','Classes & PT']].map(([p,l])=>`<a href="#${p}" ${p===active?'aria-current="page"':''}>${l}</a>`).join('')}</nav>`;
const csPage=(title,sub,body,active,action='')=>`<div class="cs-workspace">${pHeader('COACH WORKSPACE',esc(title),esc(sub),action||button('csAddAthlete','Add demo athlete','','p'))}${csNav(active)}${body}<p class="cs-foot">Shared browser demo · changes are saved on this device. Adding a profile does not invite a real person.</p></div>`;
const csPending=id=>scopeOn(id,'CHECKINS')?person(id).checkins.filter(c=>!c.review):[];
const csUnread=id=>csActive(id)?person(id).messages.filter(m=>m.from==='athlete'&&!m.replied):[];
const csNeeds=id=>csActive(id)&&((scopeOn(id,'TRAINING')&&!programFor(id))||csPending(id).length||csUnread(id).length);
const csStatus=id=>!csActive(id)?'Archived / ended':csPending(id).length?'Review check-in':csUnread(id).length?'Reply needed':scopeOn(id,'TRAINING')&&!programFor(id)?'Assign a program':'Up to date';
function csRoster(){return ROSTER.filter(a=>(cs.filter==='archived'?!csActive(a.id):csActive(a.id))&&(cs.filter!=='attention'||csNeeds(a.id))&&(cs.filter!=='unassigned'||scopeOn(a.id,'TRAINING')&&!programFor(a.id))&&(cs.group==='all'||C.profiles[a.id]?.group===cs.group)&&(!cs.query||[a.name,a.goal,C.profiles[a.id]?.group].join(' ').toLowerCase().includes(cs.query.toLowerCase())));}
function csAthleteCard(a){const p=scopeOn(a.id,'TRAINING')?programFor(a.id):null,selected=cs.selected.includes(a.id);return `<article class="cs-athlete"><div class="cs-athlete-top"><label class="cs-select"><input type="checkbox" data-cs-athlete="${a.id}" ${selected?'checked':''} aria-label="Select ${esc(a.name)}"></label>${av(a.name,'sm')}<a href="#/coach/athlete/${a.id}" class="grow"><b>${esc(a.name)}</b><span class="small">${esc(C.profiles[a.id]?.group||a.goal||'No group')}</span></a><span class="cs-status ${csNeeds(a.id)?'attention':''}">${csStatus(a.id)}</span></div><div class="cs-plan-line"><span>Program</span><b>${scopeOn(a.id,'TRAINING')?esc(p?.name||'Not assigned'):'Training not shared'}</b></div><div class="cs-quick"><a href="#/coach/athlete/${a.id}">Open athlete →</a>${csActive(a.id)?button('csStartAssign','Assign program',`data-id="${a.id}"`):button('csArchiveAthlete','Restore',`data-id="${a.id}"`)}</div></article>`;}
replaceRoute('/coach/athletes',()=>csPage('Your athletes. One clear view.','Find someone, see what needs attention, and act on a group.',`<div class="cs-toolbar"><label class="grow"><span class="sr-only">Search athletes</span><input class="input" id="cs-roster-search" value="${esc(cs.query)}" placeholder="Search name, goal or group"></label>${button('csSearch','Search')}<select class="input" data-cs-filter aria-label="Athlete filter">${[['active','Active athletes'],['attention','Needs attention'],['unassigned','No program'],['archived','Archived / ended']].map(([k,l])=>`<option value="${k}" ${cs.filter===k?'selected':''}>${l}</option>`).join('')}</select><select class="input" data-cs-group aria-label="Group"><option value="all">All groups</option>${[...new Set(Object.values(C.profiles).map(p=>p.group).filter(Boolean))].map(g=>`<option value="${esc(g)}" ${cs.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div class="cs-bulk"><b>${cs.selected.length} selected</b>${button('csSelectVisible','Select visible')}${button('csClearSelection','Clear')}${button('csStartAssign','Assign program','','p')}${button('csGroupSelected','Set group')}</div><p class="small mt16">${csRoster().length} athletes shown</p><div class="cs-athlete-grid mt16">${csRoster().map(csAthleteCard).join('')||empty('No athletes match these filters. Clear the search or choose another group.')}</div>`,'/coach/athletes'));
ACT.csSearch=()=>{cs.query=val('cs-roster-search');render();};ACT.csSelectVisible=()=>{cs.selected=[...new Set([...cs.selected,...csRoster().map(a=>a.id)])];render();};ACT.csClearSelection=()=>{cs.selected=[];render();};
ACT.csGroupSelected=()=>{if(!cs.selected.length)return toast('Select athletes first');sheet(`<h2>Group ${cs.selected.length} athletes</h2>${field('cs-group-name','Group name (blank removes group)')}${button('csSaveGroup','Apply group','','p')}`);};ACT.csSaveGroup=()=>{const group=val('cs-group-name').slice(0,40);cs.selected.forEach(id=>{if(C.profiles[id])C.profiles[id].group=group;});commitFlow('Group updated');};
ACT.csAddAthlete=()=>sheet(`<h2>Add demo athlete</h2><p class="note mt12">Create a separate local profile to test coaching multiple people. No invitation or message is sent.</p>${field('cs-athlete-name','Name')}${field('cs-athlete-goal','Goal','Build strength')}${field('cs-athlete-group','Group (optional)')}<label class="row"><input type="checkbox" id="cs-demo-sharing"><span>Enable shared sample data for this demo profile</span></label>${button('csCreateAthlete','Create profile','','p')}`);
ACT.csCreateAthlete=()=>{const name=val('cs-athlete-name');if(!name)return toast('Enter an athlete name');const id='athlete-'+uid(),shared=!!$('#cs-demo-sharing').checked,a={id,name:name.slice(0,70),goal:val('cs-athlete-goal').slice(0,100),hidden:shared?[]:SCOPES.map(s=>s[0])};C.customRoster.push(a);ROSTER.push(a);W.people[id]=freshAthlete();C.profiles[id]={group:val('cs-athlete-group').slice(0,40),archived:false,notes:''};commitFlow('Demo athlete created','/coach/athlete/'+id);};
ACT.csArchiveAthlete=t=>{const id=t.dataset.id;if(!C.profiles[id])return;if(id==='hassan'&&!W.connected){toast('The athlete must reconnect from Me → My coach.');go('/coach/athletes');return;}if(C.profiles[id].archived){C.profiles[id].archived=false;commitFlow('Athlete restored');return;}sheet(`<h2>Archive ${esc(athlete(id).name)}?</h2><p class="note mt16">Their history stays saved. They leave the active roster, and scheduled program changes will pause.</p>${button('csConfirmArchive','Archive',`data-id="${id}"`,'d')}`);};ACT.csConfirmArchive=t=>{C.profiles[t.dataset.id].archived=true;cs.selected=cs.selected.filter(id=>id!==t.dataset.id);commitFlow('Athlete archived','/coach/athletes');};
function csQueue(){const queue=[];for(const a of ROSTER.filter(a=>csActive(a.id))){for(const c of csPending(a.id))queue.push({name:a.name,label:'Check-in ready for review',detail:c.date,path:'/coach/checkin/'+a.id+'?cid='+c.id});if(csUnread(a.id).length)queue.push({name:a.name,label:'Message awaiting a reply',detail:csUnread(a.id).length+' need reply',path:'/coach/messages/'+a.id});if(scopeOn(a.id,'TRAINING')&&!programFor(a.id))queue.push({name:a.name,label:'Needs a training program',detail:a.goal||'New athlete',path:'/coach/athlete/'+a.id+'/assign'});}return queue;}
replaceRoute('/coach',()=>{const active=ROSTER.filter(a=>csActive(a.id)),queue=csQueue(),reviews=active.reduce((n,a)=>n+csPending(a.id).length,0);return csPage('A clear start to your coaching day.','Your next actions come from shared athlete records.',`<div class="cs-metrics">${[['Athletes',active.length,'/coach/athletes'],['Check-ins to review',reviews,'/coach/reviews'],['Messages to answer',active.reduce((n,a)=>n+csUnread(a.id).length,0),'/coach/messages'],['Programs',Object.keys(W.templates).filter(id=>!C.archivedTemplates[id]).length,'/coach/plans']].map(([l,n,p])=>`<a class="p-card" href="#${p}"><span class="small">${l}</span><strong>${n}</strong></a>`).join('')}</div><div class="cs-columns mt24"><section class="p-card"><div class="p-card-head"><h2>Needs your attention</h2><span class="pill">${queue.length}</span></div>${queue.slice(0,12).map(q=>row({t:esc(q.name),s:esc(q.label+' · '+q.detail),go:q.path})).join('')||empty('You’re caught up. New shared activity will appear here.')}${queue.length>12?'<a class="link mt16" href="#/coach/athletes">Open roster for remaining athletes →</a>':''}</section><aside><div class="p-card"><h2>Build once. Coach personally.</h2><p class="note mt12">Create a reusable program, review its schedule, then assign a separate copy to one athlete or a group.</p><div class="btn-row mt16">${button('newTemplate','Build program','','p')}<a class="btn s sm" href="#/coach/plans">Program library</a></div></div><div class="p-card mt16"><h2>Scheduled assignments</h2>${C.assignments.filter(a=>['scheduled','blocked'].includes(a.status)).map(a=>row({t:esc(a.program.name),s:a.start+' · '+a.athletes.length+' athletes · '+a.status,go:'/coach/assignments'})).join('')||empty('No upcoming program changes.')}<a class="link mt16" href="#/coach/assignments">Assignment history →</a></div></aside></div>`,'/coach');});
// Program drafts use stable session and exercise IDs; renaming cannot break schedules.
function csFromProgram(p,target=null){const sessions=Object.entries(p.days||{}).map(([name,d])=>({id:uid(),name,min:d.min||45,sub:d.sub||'',ex:d.ex.map(e=>({id:uid(),name:e[0],sets:e[1],reps:String(e[2]),kg:e[3],note:e[4]||'',rest:e[5]||90}))}));return {id:target?'personal-'+target:p.id,name:p.name,weeks:p.weeks||4,goal:p.goal||'Strength',target,templateId:p.id,sessions,schedule:Object.fromEntries(Array.from({length:7},(_,i)=>[i,sessions.find(s=>s.name===p.schedule?.[i])?.id||''])),dirty:false};}
function csDraft(id){if(C.drafts[id])return C.drafts[id];const p=W.templates[id];if(!p)return null;return C.drafts[id]=csFromProgram(p);}
const csCurrent=()=>C.drafts[cs.draftId];
function csTouch(){const d=csCurrent();if(d){d.dirty=true;const saved=persistFlows();const el=$('#cs-draft-status');if(el)el.textContent=saved?'Draft saved on this device':'Draft not saved — storage unavailable';}}
function csInput(label,value,fieldPath,type='text'){return `<label class="field"><span>${label}</span><input class="input" data-cs-edit="${fieldPath}" type="${type}" value="${esc(String(value??''))}"></label>`;}
function csEdit(path,value){const d=csCurrent();if(!d)return;const parts=path.split(':');if(parts[0]==='program')d[parts[1]]=value;else if(parts[0]==='schedule')d.schedule[parts[1]]=value;else{const session=d.sessions.find(s=>s.id===parts[1]);if(!session)return;if(parts[0]==='session')session[parts[2]]=value;else if(parts[0]==='exercise'){const e=session.ex.find(e=>e.id===parts[2]);if(e)e[parts[3]]=value;}}csTouch();}
function csValidate(d){if(!d?.name.trim())return 'Give the program a name.';if(!Number.isInteger(+d.weeks)||+d.weeks<1||+d.weeks>52)return 'Choose a duration from 1 to 52 weeks.';if(!d.sessions.length)return 'Add at least one session.';if(new Set(d.sessions.map(s=>s.name.trim().toLowerCase())).size!==d.sessions.length)return 'Session names must be unique.';for(const s of d.sessions){if(!s.name.trim()||!s.ex.length)return 'Each session needs a name and at least one exercise.';if(!Number.isFinite(+s.min)||+s.min<1||+s.min>300)return 'Session duration must be 1–300 minutes.';for(const e of s.ex){if(!e.name.trim()||!Number.isInteger(+e.sets)||+e.sets<1||+e.sets>30||!/^\d+(?:[–-]\d+)?$/.test(e.reps)||e.reps.split(/[–-]/).some(n=>+n<1||+n>200)||e.reps.split(/[–-]/).length===2&&+e.reps.split(/[–-]/)[0]>+e.reps.split(/[–-]/)[1]||!Number.isFinite(+e.kg)||+e.kg<0||!Number.isInteger(+e.rest)||+e.rest<0||+e.rest>900)return 'Check exercise names, sets (1–30), reps (1–200), non-negative kg and rest (0–900 sec).';}}if(!Object.values(d.schedule).some(Boolean))return 'Schedule at least one training day.';if(Object.values(d.schedule).some(id=>id&&!d.sessions.some(s=>s.id===id)))return 'A scheduled session no longer exists.';return null;}
function csCompile(d){return {id:d.templateId||d.id,name:d.name.trim(),goal:d.goal||'Strength',weeks:+d.weeks,week:1,by:'omar',days:Object.fromEntries(d.sessions.map(s=>[s.name.trim(),{name:s.name.trim(),min:+s.min,sub:s.sub||'',ex:s.ex.map(e=>[e.name.trim(),+e.sets,e.reps.replace('-', '–'),+e.kg,e.note||'',+e.rest])}])),schedule:Object.fromEntries(Object.entries(d.schedule).map(([k,id])=>[k,d.sessions.find(s=>s.id===id)?.name.trim()||null]))};}
replaceRoute('/coach/plans',()=>csPage('Your program library.','Reusable templates. Separate athlete copies. No accidental mass updates.',`<div class="cs-toolbar"><input id="cs-program-search" class="input grow" placeholder="Search programs" value="${esc(cs.templateQuery)}">${button('csProgramSearch','Search')}${button('newTemplate','Create program','','p')}</div><div class="cs-athlete-grid mt16">${Object.values(W.templates).filter(p=>!C.archivedTemplates[p.id]&&p.name.toLowerCase().includes(cs.templateQuery.toLowerCase())).map(p=>`<article class="p-card"><div class="p-label">${p.weeks} WEEKS · ${Object.keys(p.days).length} SESSIONS</div><h2 class="mt12">${esc(p.name)}</h2><p class="note mt8">${esc(p.goal||'Strength')} · ${ROSTER.filter(a=>programFor(a.id)?.id===p.id).length} assigned copies</p><div class="btn-row mt16"><a class="btn s sm" href="#/coach/plans/program/${p.id}">Edit template</a>${button('csStartAssign','Assign',`data-pid="${p.id}"`,'p')}</div><div class="btn-row mt12">${button('csDuplicateProgram','Duplicate',`data-id="${p.id}"`)}${button('csArchiveProgram','Archive',`data-id="${p.id}"`)}</div></article>`).join('')||empty('No matching programs. Create one or use a saved draft below.')}</div><div class="p-card mt24"><h2>Saved drafts</h2>${Object.values(C.drafts).filter(d=>d.dirty||!W.templates[d.id]).map(d=>row({t:esc(d.name||'Untitled program'),s:d.target?'Personal copy · '+athlete(d.target).name:'Template draft',go:'/coach/plans/program/'+d.id})).join('')||empty('No unfinished drafts.')}</div><details class="p-card mt16"><summary>Archived templates</summary>${Object.keys(C.archivedTemplates).filter(id=>C.archivedTemplates[id]&&W.templates[id]).map(id=>row({t:esc(W.templates[id].name),right:button('csRestoreProgram','Restore',`data-id="${id}"`)})).join('')}</details>`,'/coach/plans'));
ACT.csProgramSearch=()=>{cs.templateQuery=val('cs-program-search');render();};
ACT.newTemplate=()=>{sheet(`<h2>Start a program</h2><p class="note mt12">Start empty or copy a template, then edit it for your athletes.</p>${button('csBlankProgram','Start empty','','p')}${Object.values(W.templates).filter(p=>!C.archivedTemplates[p.id]).map(p=>row({t:esc(p.name),s:Object.keys(p.days).length+' sessions',right:button('csDuplicateProgram','Use template',`data-id="${p.id}"`)})).join('')}`);};
ACT.csBlankProgram=()=>{const id='program-'+uid(),sid=uid();C.drafts[id]={id,templateId:id,name:'',goal:'Strength',weeks:4,target:null,sessions:[{id:sid,name:'Session A',min:45,sub:'',ex:[]}],schedule:{0:'',1:sid,2:'',3:'',4:'',5:'',6:''},dirty:true};persistFlows();closeSheet();go('/coach/plans/program/'+id);};
ACT.csDuplicateProgram=t=>{const p=W.templates[t.dataset.id];if(!p)return;const id='program-'+uid(),d=csFromProgram({...clone(p),id,name:p.name+' copy'});d.dirty=true;C.drafts[id]=d;persistFlows();closeSheet();go('/coach/plans/program/'+id);};
ACT.csArchiveProgram=t=>{const id=t.dataset.id;sheet(`<h2>Archive template?</h2><p class="note mt16">Existing athlete copies and scheduled assignments remain unchanged.</p>${button('csConfirmArchiveProgram','Archive template',`data-id="${id}"`,'d')}`);};ACT.csConfirmArchiveProgram=t=>{C.archivedTemplates[t.dataset.id]=true;commitFlow('Template archived');};ACT.csRestoreProgram=t=>{C.archivedTemplates[t.dataset.id]=false;commitFlow('Template restored');};
function csSessionMarkup(d,s){return `<section class="p-card cs-session"><div class="cs-toolbar">${csInput('Session name',s.name,'session:'+s.id+':name')} ${csInput('Minutes',s.min,'session:'+s.id+':min','number')}</div>${csInput('Session focus / instructions',s.sub,'session:'+s.id+':sub')}<div class="cs-ex-list">${s.ex.map((e,i)=>`<article class="cs-exercise"><div class="cs-ex-heading"><span class="cs-number">${i+1}</span><b>${esc(e.name)}</b><div class="cs-ex-actions">${button('csMoveExercise','↑',`data-sid="${s.id}" data-id="${e.id}" data-dir="-1" aria-label="Move exercise up"`)}${button('csMoveExercise','↓',`data-sid="${s.id}" data-id="${e.id}" data-dir="1" aria-label="Move exercise down"`)}${button('csCopyExercise','Copy',`data-sid="${s.id}" data-id="${e.id}"`)}${button('csRemoveExercise','Remove',`data-sid="${s.id}" data-id="${e.id}"`)}</div></div><div class="cs-ex-fields">${[['sets','Sets','number'],['reps','Reps / range','text'],['kg','Weight · kg','number'],['rest','Rest · sec','number']].map(([k,l,t])=>csInput(l,e[k],'exercise:'+s.id+':'+e.id+':'+k,t)).join('')}</div>${csInput('Coach note (optional)',e.note,'exercise:'+s.id+':'+e.id+':note')}</article>`).join('')||`<div class="cs-empty"><h3>Build this session.</h3><p>Choose exercises from the library. Set targets here once, then reuse this session.</p></div>`}</div>${button('csExercisePicker','+ Add exercises',`data-sid="${s.id}"`,'p')}<div class="btn-row mt24">${button('csCopySession','Duplicate session',`data-sid="${s.id}"`)}${button('csMoveSession','Move earlier',`data-sid="${s.id}" data-dir="-1"`)}${button('csMoveSession','Move later',`data-sid="${s.id}" data-dir="1"`)}${button('csRemoveSession','Delete session',`data-sid="${s.id}"`)}</div></section>`;}
replaceRoute('/coach/plans/program/:pid',p=>{const d=csDraft(p.pid);if(!d)return csPage('Program not found','Create a program to get started.',button('newTemplate','Create program','','p'),'/coach/plans');cs.draftId=p.pid;if(!d.sessions.some(s=>s.id===cs.sessionId))cs.sessionId=d.sessions[0]?.id;const s=d.sessions.find(s=>s.id===cs.sessionId);return csPage(d.target?'Personalize '+athlete(d.target).name+'’s plan':'Build your program.','1 · Details     2 · Sessions     3 · Weekly schedule     4 · Review & assign',`<div class="cs-builder"><aside class="cs-builder-side"><div class="p-card">${csInput('Program name',d.name,'program:name')}${csInput('Duration · weeks',d.weeks,'program:weeks','number')}${csInput('Goal',d.goal,'program:goal')}<p class="small mt12" id="cs-draft-status">${d.dirty?'Draft saved on this device':'Saved template · changes stay in your draft'}</p></div><div class="p-card mt16"><div class="p-card-head"><h2>Sessions</h2>${button('csAddSession','+', 'aria-label="Add session"')}</div>${d.sessions.map((x,i)=>`<button class="cs-session-tab ${x.id===cs.sessionId?'active':''}" data-act="csChooseSession" data-id="${x.id}"><span>${i+1}</span><div><b>${esc(x.name||'Untitled session')}</b><small>${x.ex.length} exercises · ${x.ex.reduce((n,e)=>n+(+e.sets||0),0)} sets</small></div></button>`).join('')}${button('csAddSession','Add session')}</div><div class="p-card mt16"><h2>Weekly schedule</h2><p class="note mt8">Sessions repeat each week for ${esc(String(d.weeks))} weeks.</p>${[1,2,3,4,5,6,0].map(i=>`<label class="cs-schedule-row"><span>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</span><select class="input" data-cs-edit="schedule:${i}"><option value="">Rest</option>${d.sessions.map(x=>`<option value="${x.id}" ${d.schedule[i]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`).join('')}</div></aside><main class="cs-builder-main">${s?csSessionMarkup(d,s):`<div class="p-card">${button('csAddSession','Add your first session','','p')}</div>`}<div class="cs-savebar"><span class="grow small">${d.target?'Only this athlete’s future sessions change.':'Template edits do not change assigned athlete copies.'}</span>${button('csUndoDraft','Undo delete')}${button('csSaveDraft',d.target?'Save athlete plan':'Save template','','s')}${!d.target?button('csSaveAndAssign','Save & assign','','p'):''}</div></main></div>`,'/coach/plans',`<a class="btn s sm" href="#/coach/plans">Back to programs</a>`);});
function csUndoPoint(){const d=csCurrent();d.undo={sessions:clone(d.sessions),schedule:clone(d.schedule)};}
ACT.csUndoDraft=()=>{const d=csCurrent();if(!d?.undo)return toast('Nothing to undo');d.sessions=d.undo.sessions;d.schedule=d.undo.schedule;delete d.undo;csTouch();render();};
ACT.csChooseSession=t=>{cs.sessionId=t.dataset.id;render();};
ACT.csAddSession=()=>{const d=csCurrent(),sid=uid();let n=d.sessions.length+1,name='Session '+n;while(d.sessions.some(s=>s.name===name))name='Session '+(++n);d.sessions.push({id:sid,name,min:45,sub:'',ex:[]});cs.sessionId=sid;csTouch();render();};
ACT.csCopySession=t=>{const d=csCurrent(),s=d.sessions.find(s=>s.id===t.dataset.sid);if(!s)return;const copy=clone(s);copy.id=uid();copy.name=s.name+' copy';while(d.sessions.some(s=>s.name===copy.name))copy.name+=' copy';copy.ex.forEach(e=>e.id=uid());d.sessions.push(copy);cs.sessionId=copy.id;csTouch();render();};
ACT.csRemoveSession=t=>{const d=csCurrent();csUndoPoint();d.sessions=d.sessions.filter(s=>s.id!==t.dataset.sid);Object.keys(d.schedule).forEach(k=>{if(d.schedule[k]===t.dataset.sid)d.schedule[k]='';});csTouch();render();};
function csMove(list,id,dir){const i=list.findIndex(x=>x.id===id),j=i+Number(dir);if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];}
ACT.csMoveSession=t=>{csMove(csCurrent().sessions,t.dataset.sid,t.dataset.dir);csTouch();render();};
ACT.csMoveExercise=t=>{const s=csCurrent().sessions.find(s=>s.id===t.dataset.sid);csMove(s.ex,t.dataset.id,t.dataset.dir);csTouch();render();};
ACT.csCopyExercise=t=>{const s=csCurrent().sessions.find(s=>s.id===t.dataset.sid),e=s.ex.find(e=>e.id===t.dataset.id);s.ex.splice(s.ex.indexOf(e)+1,0,{...clone(e),id:uid()});csTouch();render();};
ACT.csRemoveExercise=t=>{csUndoPoint();const s=csCurrent().sessions.find(s=>s.id===t.dataset.sid);s.ex=s.ex.filter(e=>e.id!==t.dataset.id);csTouch();render();};
function csPickerResults(q=''){return EXERCISES.filter(e=>[e.name,e.muscle,e.equip].join(' ').toLowerCase().includes(q.toLowerCase())).map(e=>row({t:esc(e.name),s:esc(e.muscle+' · '+e.equip),right:button('csPickExercise','Add',`data-name="${esc(e.name)}"`)})).join('')||empty('No match. Enter a custom exercise below.');}
ACT.csExercisePicker=t=>{cs.sessionId=t.dataset.sid;sheet(`<h2>Add exercises</h2><p class="note mt8">Add several exercises, then close this panel to set their targets.</p><div class="cs-toolbar mt16"><input id="cs-ex-search" class="input" placeholder="Search exercise, muscle or equipment">${button('csSearchExercise','Search')}</div><div id="cs-ex-results" style="max-height:330px;overflow:auto">${csPickerResults()}</div>${field('cs-custom-ex','Custom exercise name')}${button('csCustomExercise','Add custom exercise')}<p id="cs-ex-added" class="small mt12" role="status"></p><div class="btn-row mt16">${button('csFinishExercisePicker','Done','','p')}</div>`);};
ACT.csSearchExercise=()=>{$('#cs-ex-results').innerHTML=csPickerResults(val('cs-ex-search'));};
function csAddExercise(name){const s=csCurrent()?.sessions.find(s=>s.id===cs.sessionId);if(!s||!name.trim())return false;s.ex.push({id:uid(),name:name.trim().slice(0,100),sets:3,reps:'10',kg:0,rest:90,note:''});csTouch();return true;}
ACT.csPickExercise=t=>{if(csAddExercise(t.dataset.name))$('#cs-ex-added').textContent=t.dataset.name+' added · '+csCurrent().sessions.find(s=>s.id===cs.sessionId).ex.length+' exercises in session';};ACT.csCustomExercise=()=>{const name=val('cs-custom-ex');if(csAddExercise(name)){$('#cs-ex-added').textContent=name+' added';$('#cs-custom-ex').value='';}};ACT.csFinishExercisePicker=()=>{closeSheet();render();};
function csSave(){const d=csCurrent(),error=csValidate(d);if(error){toast(error);return false;}const p=csCompile(d);if(d.target){if(!scopeOn(d.target,'TRAINING')){toast('Training is not shared by this athlete');return false;}const prior=clone(programFor(d.target));C.assignments.filter(a=>a.athlete===d.target&&a.status==='active').forEach(a=>a.status='replaced');if(d.target==='hassan')Object.assign(PROGRAM,p);else person(d.target).program=p;C.assignments.unshift({id:uid(),athlete:d.target,athletes:[d.target],program:clone(p),previous:prior,start:csDay(),status:'active',kind:'personalized'});changeFlow(d.target,'Personal plan updated: '+p.name,'TRAINING');}else{W.templates[d.id]=p;C.archivedTemplates[d.id]=false;}d.dirty=false;if(!persistFlows()){d.dirty=true;return false;}return true;}
ACT.csSaveDraft=()=>{if(csSave())commitFlow(csCurrent().target?'Athlete plan saved':'Template saved');};ACT.csSaveAndAssign=()=>{if(!csSave())return;ACT.csStartAssign({dataset:{pid:csCurrent().id}});};
ACT.csPersonalize=t=>{const id=t.dataset.id,p=programFor(id);if(!p||!scopeOn(id,'TRAINING'))return toast('Assign a shared program first');const key='personal-'+id;if(!C.drafts[key]?.dirty)C.drafts[key]=csFromProgram(clone(p),id);persistFlows();go('/coach/plans/program/'+key);};
// Assignments are reviewed snapshots, never live references to the template.
function csAssignmentDraft(){return cs.assignment||(cs.assignment=C.assignmentDraft||{pid:'',athletes:[],start:csDay(),review:false,query:''});}
ACT.csStartAssign=t=>{cs.assignment={pid:t.dataset.pid||'',athletes:t.dataset.id?[t.dataset.id]:[...cs.selected],start:csDay(),review:false,query:''};C.assignmentDraft=cs.assignment;persistFlows();go('/coach/assign');};
function csAssignEligible(id){return csActive(id)&&scopeOn(id,'TRAINING');}
route('/coach/assign',()=>{const a=csAssignmentDraft(),p=W.templates[a.pid],eligible=ROSTER.filter(x=>csAssignEligible(x.id)&&(!a.query||[x.name,C.profiles[x.id]?.group].join(' ').toLowerCase().includes(a.query.toLowerCase())));return csPage(a.review?'Review your assignment.':'Assign a program.','Choose a template, select athletes, set the start date, then review.',a.review?`<div class="p-card"><div class="p-label">${a.athletes.length} ATHLETES · STARTS ${esc(a.start)}</div><h2 class="mt12">${esc(a.snapshot.name)}</h2><p class="note mt12">${a.snapshot.weeks} weeks · ${Object.keys(a.snapshot.days).length} sessions. Each athlete receives a separate copy. Active workouts and completed logs stay unchanged.</p>${a.athletes.map(id=>row({t:esc(athlete(id).name),s:'Replaces '+esc(programFor(id)?.name||'no current program')+' · '+C.assignments.filter(x=>x.athlete===id&&['scheduled','blocked'].includes(x.status)).length+' pending assignments will be replaced'})).join('')}<h3 class="mt24">Weekly schedule</h3>${[1,2,3,4,5,6,0].map(i=>row({t:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i],s:esc(a.snapshot.schedule[i]||'Rest')})).join('')}<div class="btn-row mt24">${button('csBackAssign','Edit selection')}${button('csConfirmAssign',a.start>csDay()?'Schedule program':'Assign now','','p')}</div></div>`:`<div class="cs-columns"><section class="p-card"><label class="field"><span>1 · Saved program</span><select class="input" data-cs-assign="pid"><option value="">Choose a program</option>${Object.values(W.templates).filter(p=>!C.archivedTemplates[p.id]).map(p=>`<option value="${p.id}" ${p.id===a.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>${p?`<p class="note">${Object.keys(p.days).length} sessions · ${p.weeks} weeks</p>`:empty('Save a template in the program builder first.')}<label class="field"><span>2 · Start date</span><input class="input" type="date" data-cs-assign="start" value="${esc(a.start)}" min="${csDay()}"></label><p class="note mt12">Demo date: ${csDay()}. Future assignments activate when the demo is opened on or after their start date, using the demo clock.</p></section><section class="p-card"><h2>3 · Choose athletes</h2><div class="cs-toolbar mt16"><input class="input grow" id="cs-assignment-search" value="${esc(a.query)}" placeholder="Search name or group">${button('csAssignmentSearch','Search')}</div><p class="small mt12">${a.athletes.length} selected · athletes with training sharing enabled</p>${button('csAssignVisible','Select visible')}${a.athletes.filter(id=>!csAssignEligible(id)).map(id=>row({t:esc(athlete(id).name),s:'Unavailable: archived or training not shared',right:button('csRemoveAssignee','Remove',`data-id="${id}"`)})).join('')}${eligible.map(x=>`<label class="row" style="gap:12px"><input type="checkbox" data-cs-assignee="${x.id}" ${a.athletes.includes(x.id)?'checked':''}><span class="row__t"><b>${esc(x.name)}</b><span>${esc(C.profiles[x.id]?.group||x.goal)} · ${esc(programFor(x.id)?.name||'No program')}</span></span></label>`).join('')||empty('No eligible athletes. Check their sharing settings or search.')}<div class="btn-row mt24">${button('csReviewAssign','Review assignment','','p')}</div></section></div>`,'/coach/plans',`<a class="btn s sm" href="#/coach/athletes">Back to athletes</a>`);});
ACT.csAssignmentSearch=()=>{csAssignmentDraft().query=val('cs-assignment-search');render();};ACT.csAssignVisible=()=>{const a=csAssignmentDraft();a.athletes=[...new Set([...a.athletes,...ROSTER.filter(x=>csAssignEligible(x.id)&&(!a.query||[x.name,C.profiles[x.id]?.group].join(' ').toLowerCase().includes(a.query.toLowerCase()))).map(x=>x.id)])];persistFlows();render();};
function csAssignError(a){if(!W.templates[a.pid]||C.archivedTemplates[a.pid])return 'Choose an active saved template.';if(!a.athletes.length)return 'Select at least one athlete.';if(a.athletes.some(id=>!csAssignEligible(id)))return 'Some selected athletes are archived or not sharing training. Update your selection.';if(!/^\d{4}-\d{2}-\d{2}$/.test(a.start)||!Number.isFinite(+new Date(a.start))||a.start<csDay())return 'Choose today or a future start date.';return csValidate(csFromProgram(a.snapshot||W.templates[a.pid]));}
ACT.csReviewAssign=()=>{const a=csAssignmentDraft(),error=csAssignError(a);if(error)return toast(error);a.snapshot=clone(W.templates[a.pid]);a.review=true;C.assignmentDraft=a;persistFlows();render();};ACT.csBackAssign=()=>{csAssignmentDraft().review=false;render();};
function csApplyAssignment(a){if(!csAssignEligible(a.athlete)){a.status='blocked';return false;}a.previous=clone(programFor(a.athlete)||null);C.assignments.filter(x=>x.athlete===a.athlete&&x.status==='active').forEach(x=>x.status='replaced');const p=clone(a.program);p.starts=a.start;if(a.athlete==='hassan')Object.assign(PROGRAM,p);else person(a.athlete).program=p;a.status='active';changeFlow(a.athlete,'Program assigned: '+p.name,'TRAINING');return true;}
ACT.csConfirmAssign=()=>{const a=csAssignmentDraft();if(!a.review||!a.snapshot)return;const error=csAssignError(a);if(error){a.review=false;persistFlows();render();return toast(error);}const batch=uid();for(const id of [...new Set(a.athletes)]){C.assignments.filter(x=>x.athlete===id&&['scheduled','blocked'].includes(x.status)).forEach(x=>x.status='cancelled');const entry={id:uid(),batch,athlete:id,athletes:[id],program:clone(a.snapshot),start:a.start,status:'scheduled'};if(a.start<=csDay())csApplyAssignment(entry);C.assignments.unshift(entry);if(entry.status==='scheduled')notifyFlow('athlete','Program scheduled: '+entry.program.name,'/plan',id,'TRAINING');}const n=a.athletes.length;cs.assignment=null;C.assignmentDraft=null;cs.selected=[];commitFlow('Program saved for '+n+' athletes','/coach/assignments');};
function csActivateDue(){let changed=false;for(const a of C.assignments.filter(a=>['scheduled','blocked'].includes(a.status)&&a.start<=csDay())){if(csAssignEligible(a.athlete)){csApplyAssignment(a);changed=true;}else if(a.status!=='blocked'){a.status='blocked';changed=true;}}if(changed)persistFlows();}
route('/coach/assignments',()=>csPage('Assignment history.','See who received what, and manage upcoming changes.',`<div class="p-card">${C.assignments.map(a=>row({t:esc(athlete(a.athlete).name+' · '+a.program.name),s:a.start+' · '+a.status+(a.status==='blocked'?' · archive or sharing restriction':''),right:['scheduled','blocked'].includes(a.status)?button('csCancelAssignment','Cancel',`data-id="${a.id}"`):'',go:undefined})).join('')||empty('No assignments yet. Assign a saved program to one or more athletes.')}<div class="btn-row mt16">${button('csStartAssign','Assign a program','','p')}</div></div>`,'/coach/plans'));
ACT.csCancelAssignment=t=>{const a=C.assignments.find(a=>a.id===t.dataset.id);if(!a||!['scheduled','blocked'].includes(a.status))return;a.status='cancelled';notifyFlow('athlete','Scheduled program cancelled','/plan',a.athlete,'TRAINING');commitFlow('Scheduled assignment cancelled');};
ACT.pushProgramFlow=t=>{cs.selected=ROSTER.filter(a=>csAssignEligible(a.id)&&programFor(a.id)?.id===t.dataset.id).map(a=>a.id);ACT.csStartAssign({dataset:{pid:t.dataset.id}});};
const csAthleteNav=id=>`<div class="cs-nav" aria-label="Athlete sections">${[['','Overview'],['/program','Program'],['/training','Workouts'],['/nutrition','Food'],['/checkins','Check-ins'],['/progress','Progress']].map(([p,l])=>`<a href="#/coach/athlete/${id}${p}">${l}</a>`).join('')}<a href="#/coach/messages/${id}">Message</a></div>`;
function csAthleteOverview(id){const a=ROSTER.find(a=>a.id===id);if(!a)return csPage('Athlete not found','',empty('Choose an athlete from your roster.'),'/coach/athletes');if(!csActive(id))return csPage(a.name,'Archived or coaching ended.',button('csArchiveAthlete','Restore athlete',`data-id="${id}"`),'/coach/athletes');const p=scopeOn(id,'TRAINING')?programFor(id):null;return csPage(a.name,a.goal||'Athlete profile',`${csAthleteNav(id)}<div class="cs-columns"><section><div class="p-card"><div class="p-label">CURRENT PROGRAM</div><h2 class="mt12">${scopeOn(id,'TRAINING')?esc(p?.name||'No program assigned'):'Training not shared'}</h2><p class="note mt12">${p?p.weeks+' weeks · '+Object.keys(p.days).length+' sessions':'Start with a template, then personalize the athlete’s copy.'}</p><div class="btn-row mt16">${button('csStartAssign',p?'Replace program':'Assign program',`data-id="${id}"`,'p')}${p?button('csPersonalize','Personalize plan',`data-id="${id}"`):''}</div></div><div class="p-card mt16"><h2>Next actions</h2>${csPending(id).map(c=>row({t:'Review check-in',s:c.date,go:'/coach/checkin/'+id+'?cid='+c.id})).join('')}${row({t:'Conversation',s:csUnread(id).length+' messages need reply',go:'/coach/messages/'+id})}${scopeOn(id,'TRAINING')?row({t:'Workout history',s:historyFor(id).length+' logged sessions',go:'/coach/athlete/'+id+'/training'}):''}</div><div class="p-card mt16"><h2>Recent plan changes</h2>${person(id).changes.filter(c=>!c.scope||scopeOn(id,c.scope)).slice(0,5).map(c=>row({t:esc(c.text),s:c.at})).join('')||empty('No new changes.')}</div></section><aside><div class="p-card"><h2>Coach tools</h2>${row({t:'Nutrition targets',s:scopeOn(id,'NUTRITION')?'Set and update daily targets':'Not shared',go:'/coach/athlete/'+id+'/targets'})}${row({t:'Reminders',s:scopeOn(id,'REMINDERS')?'Assign and review adherence':'Not shared',go:'/coach/athlete/'+id+'/reminders'})}${row({t:'Program schedule',go:'/coach/athlete/'+id+'/program'})}</div><div class="p-card mt16"><h2>Coach notes</h2><p class="note mt8">Private to the coach view in this demo.</p><textarea class="input mt12" id="cs-athlete-notes">${esc(C.profiles[id].notes||'')}</textarea>${button('csSaveNotes','Save note',`data-id="${id}"`)}<div class="mt16">${field('cs-single-group','Group',C.profiles[id].group||'')}${button('csSaveSingleGroup','Save group',`data-id="${id}"`)}</div></div><div class="p-card mt16"><h2>Shared with you</h2>${SCOPES.map(([k,l])=>`<p class="small mt8">${scopeOn(id,k)?'✓':'—'} ${l}</p>`).join('')}<div class="mt24">${button('csArchiveAthlete','Archive athlete',`data-id="${id}"`)}</div></div></aside></div>`,'/coach/athletes',`<a class="btn s sm" href="#/coach/athletes">All athletes</a>`);}
replaceRoute('/coach/athlete/:id',p=>csAthleteOverview(p.id));
const csAthleteTabBefore=ROUTES.find(r=>r.pattern==='/coach/athlete/:id/:tab').fn;
replaceRoute('/coach/athlete/:id/:tab',(p,q)=>{if(p.tab==='overview')return csAthleteOverview(p.id);if(p.tab==='assign'){if(!csAssignEligible(p.id))return page('Training not shared',empty('This athlete is not available for program assignment.'));return csPage('Assign to '+athlete(p.id).name,'Choose a saved program or create a new one.',`${csAthleteNav(p.id)}${Object.values(W.templates).filter(x=>!C.archivedTemplates[x.id]).map(pr=>row({t:esc(pr.name),s:pr.weeks+' weeks',right:button('csStartAssign','Choose',`data-id="${p.id}" data-pid="${pr.id}"`)})).join('')}${button('newTemplate','Create program','','p')}`,'/coach/athletes');}if(p.tab==='program'){if(!scopeOn(p.id,'TRAINING'))return page('Training not shared','');const pr=programFor(p.id);return csPage(athlete(p.id).name+'’s program',pr?.name||'No assigned program',`${csAthleteNav(p.id)}<div class="btn-row">${button('csStartAssign','Assign / replace',`data-id="${p.id}"`,'p')}${pr?button('csPersonalize','Personalize this copy',`data-id="${p.id}"`):''}</div>${pr?Object.entries(pr.days).map(([name,d])=>`<div class="p-card mt16"><h2>${esc(name)}</h2>${d.ex.map(e=>row({t:esc(e[0]),s:e[1]+' × '+esc(String(e[2]))+' · '+e[3]+' kg · '+(e[5]??90)+' s rest'})).join('')}</div>`).join(''):empty('Choose a saved program to get started.')}<div class="p-card mt16"><h2>Upcoming assignments</h2>${C.assignments.filter(a=>a.athlete===p.id&&['scheduled','blocked'].includes(a.status)).map(a=>row({t:esc(a.program.name),s:a.start+' · '+a.status,right:button('csCancelAssignment','Cancel',`data-id="${a.id}"`)})).join('')||empty('No upcoming changes.')}</div>`,'/coach/athletes');}if(p.tab==='checkins'){if(!scopeOn(p.id,'CHECKINS'))return page('Check-ins private','');return csPage(athlete(p.id).name+'’s check-ins','Every submission keeps its own answers and review.',`${csAthleteNav(p.id)}<div class="p-card">${person(p.id).checkins.map(c=>row({t:c.date,s:c.review?'Reviewed':'Awaiting review',go:'/coach/checkin/'+p.id+'?cid='+c.id})).join('')|| W.onboarding=W.onboarding||{step:1,provider:null,draft:{},complete:false};
function setupSelect(id,label,options,value){return `<label class="field"><span>${label}</span><select class="input" id="${id}">${options.map(([k,t])=>`<option value="${k}" ${String(value)===String(k)?'selected':''}>${t}</option>`).join('')}</select></label>`;}
function setupFields(){const a=W.onboarding.draft;return `${field('setup-name','Name',a.name||W.profile.name||'')}${field('setup-age','Age',a.age||'','number')}${field('setup-height','Height (cm)',a.height||'','number')}${field('setup-weight','Current weight (kg)',a.weight||'','number')}${field('setup-goal-weight','Goal weight (kg, optional)',a.goalWeight||'','number')}${setupSelect('setup-goal','Main goal',[['lose','Lose fat'],['maintain','Maintain weight'],['muscle','Build muscle'],['fitness','Improve fitness']],a.goal||'fitness')}`;}
function setupTraining(){const a=W.onboarding.draft;return `${setupSelect('setup-experience','Training experience',[['new','New to training'],['some','Some experience'],['experienced','Experienced']],a.experience||'new')}${field('setup-days','Training days per week',a.days||3,'number')}${field('setup-minutes','Minutes per session',a.minutes||45,'number')}${setupSelect('setup-equipment','Training location',[['gym','Gym'],['home','Home with equipment'],['bodyweight','Bodyweight']],a.equipment||'gym')}${setupSelect('setup-activity','Daily activity outside workouts',[['1.2','Mostly sitting'],['1.375','Lightly active'],['1.55','Moderately active'],['1.725','Very active']],a.activity||'1.2')}${field('setup-pain','Pain or training limitations (optional)',a.pain||'')}${field('setup-food','Food preferences or allergies (optional)',a.food||'')}${setupSelect('setup-coaching','Who sets your nutrition targets?',[['self','I manage my targets'],['coach','My coach']],a.coaching||'self')}<p class="note mt16">These details personalize your profile. Reporting pain to a coach still requires your sharing consent.</p>`;}
function setupNutrition(prefix='setup',a=W.onboarding.draft){return `${setupSelect(prefix+'-source','Energy value source',[['maintenance','Daily maintenance estimate'],['inbody','InBody BMR plus activity']],a.source||'maintenance')}${field(prefix+'-energy','Maintenance estimate or InBody BMR (kcal/day)',a.energy||'','number')}<p class="note">If using InBody, enter BMR from the report. BMR is resting energy, not daily maintenance. Do not use an already reduced diet target as maintenance.</p>${field(prefix+'-scan-date','InBody report date (optional)',a.scanDate||'','date')}${field(prefix+'-bodyfat','InBody body fat percent (optional)',a.bodyfat||'','number')}${setupSelect(prefix+'-deficit-mode','Deficit format',[['kcal','Calories per day'],['percent','Percent of maintenance']],a.deficitMode||'kcal')}${field(prefix+'-deficit','Your chosen deficit (0 for maintenance)',a.deficit??0,'number')}${field(prefix+'-protein','Protein target (g, optional)',a.protein||'','number')}${field(prefix+'-carbs','Carbs target (g, optional)',a.carbs||'','number')}${field(prefix+'-fat','Fat target (g, optional)',a.fat||'','number')}${setupSelect(prefix+'-special','Does pregnancy, breastfeeding or a condition require a clinician-set diet?',[['no','No'],['yes','Yes or unsure']],a.special||'no')}<p class="note mt16">This is an estimate, not a prescribed diet. Higher deficits and unusually low targets require professional review. You can leave nutrition unset and continue.</p>`;}
function setupReadNutrition(prefix,a){return {...a,source:val(prefix+'-source'),energy:Number(val(prefix+'-energy')),scanDate:val(prefix+'-scan-date'),bodyfat:val(prefix+'-bodyfat')===''?null:Number(val(prefix+'-bodyfat')),deficitMode:val(prefix+'-deficit-mode'),deficit:Number(val(prefix+'-deficit')),protein:Number(val(prefix+'-protein')||0),carbs:Number(val(prefix+'-carbs')||0),fat:Number(val(prefix+'-fat')||0),special:val(prefix+'-special')};}
function setupEstimate(a){if(!Number.isFinite(Number(a.age))||Number(a.age)<18||a.special!=='no')return {error:'Use a clinician-set target rather than this estimator.'};const energy=Number(a.energy),activity=Number(a.activity),deficit=Number(a.deficit);if(!['maintenance','inbody'].includes(a.source)||!Number.isFinite(energy)||energy<500||energy>10000)return {error:'Enter a valid maintenance estimate or report BMR.'};if(a.source==='inbody'&&![1.2,1.375,1.55,1.725].includes(activity))return {error:'Choose your daily activity level.'};if(!['kcal','percent'].includes(a.deficitMode)||!Number.isFinite(deficit)||deficit<0)return {error:'Enter a non-negative deficit.'};if(a.scanDate&&(!validDate(a.scanDate)||a.scanDate>iso(TODAY)))return {error:'Choose a valid past report date.'};if(a.bodyfat!=null&&(!Number.isFinite(a.bodyfat)||a.bodyfat<=0||a.bodyfat>=100))return {error:'Enter a valid body fat percentage or leave it blank.'};const maintenance=Math.round(a.source==='inbody'?energy*activity:energy),cut=Math.round(a.deficitMode==='percent'?maintenance*deficit/100:deficit),kcal=maintenance-cut;if(cut>maintenance*.25||kcal<1200)return {error:'This target falls outside this estimator’s limits. Ask a qualified professional to set it.'};const macros=[a.protein,a.carbs,a.fat].map(Number);if(macros.some(n=>!Number.isFinite(n)||n<0)||4*macros[0]+4*macros[1]+9*macros[2]>kcal*1.1)return {error:'Check your macro targets against the calorie target.'};return {maintenance,deficit:cut,kcal,p:macros[0],c:macros[1],f:macros[2],source:a.source};}
replaceRoute('/login',()=>({html:`${pHeader('START YOUR PIVOT','Built around you.','Create your profile, set your plan and track your progress.')}<section class="p-card setup-card">${button('setupProvider','Continue with Apple','data-provider="apple"','p')}${button('setupProvider','Continue with Google','data-provider="google"')}<p class="note mt16">Prototype preview: Apple and Google authentication are not connected yet. No credentials are collected.</p><h2 class="mt24">Explore demo accounts</h2>${button('signIn','Hassan · Athlete','data-mode="athlete"')}${button('signIn','Omar · Coach · '+ROSTER.length+' athletes','data-mode="coach"')}<a class="link mt16" href="#/onboarding">Preview personal setup</a></section>`,bare:true}));
ACT.setupProvider=t=>{if(!['apple','google'].includes(t.dataset.provider))return;W.onboarding.provider=t.dataset.provider;sheet(`<h2>${t.dataset.provider==='apple'?'Apple':'Google'} sign-up preview</h2><p class="note mt16">The production app will open secure provider sign-in. This demo only previews the onboarding screens and does not authenticate you.</p>${button('setupDemoContinue','Preview onboarding','','p')}`);};
ACT.setupDemoContinue=()=>{S.signedIn=true;S.mode='athlete';W.onboarding.step=1;closeSheet();go('/onboarding');};
route('/onboarding',()=>{const o=W.onboarding,step=o.step||1,a=o.draft;let body=step===1?setupFields():step===2?setupTraining():step===3?(a.coaching==='coach'?'<p class="callout">Your coach will set your calorie and macro targets. Personal calorie estimates will not replace a coach target.</p>':setupNutrition()):`<h2>${esc(a.name||'Your profile')}</h2><p class="mt16">${a.age} years · ${a.height} cm · ${a.weight} kg · ${esc(a.goal||'fitness')}</p><p class="mt12">${a.days} days per week · ${a.minutes} minutes · ${esc(a.equipment||'')}</p><p class="mt12">${a.target?`Estimated maintenance ${a.target.maintenance} − deficit ${a.target.deficit} = <strong>${a.target.kcal} kcal/day</strong>`:a.coaching==='coach'?'Nutrition managed by your coach.':'Nutrition target not set yet.'}</p><p class="note mt16">Review and edit before saving. Your current logs are kept. Apple/Google sign-in is a preview only.</p>`;return page('Personal setup · '+step+' / 4',`<div class="p-card setup-card"><div class="bar"><i style="width:${step/4*100}%"></i></div><h2 class="mt24">${['About you','Your training','Your nutrition','Review your setup'][step-1]}</h2>${body}<div class="btn-row mt24">${step>1?button('setupBack','Back'):''}${button(step===4?'setupFinish':'setupNext',step===4?'Save and open PIVOT':'Continue','','p')}${step===3&&a.coaching!=='coach'?button('setupSkipNutrition','Set nutrition later'):''}</div></div>`,'/login');},{bare:true});
ACT.setupNext=()=>{const o=W.onboarding;let a={...o.draft};if(o.step===1){a={...a,name:val('setup-name'),age:Number(val('setup-age')),height:Number(val('setup-height')),weight:Number(val('setup-weight')),goalWeight:val('setup-goal-weight')===''?null:Number(val('setup-goal-weight')),goal:val('setup-goal')};if(!a.name||!Number.isFinite(a.age)||a.age<13||a.age>110||!Number.isFinite(a.height)||a.height<100||a.height>250||!Number.isFinite(a.weight)||a.weight<25||a.weight>400||a.goalWeight!=null&&(!Number.isFinite(a.goalWeight)||a.goalWeight<25||a.goalWeight>400))return toast('Check your name, age, height and weight.');}else if(o.step===2){a={...a,experience:val('setup-experience'),days:Number(val('setup-days')),minutes:Number(val('setup-minutes')),equipment:val('setup-equipment'),activity:val('setup-activity'),pain:val('setup-pain'),food:val('setup-food'),coaching:val('setup-coaching')};if(!Number.isInteger(a.days)||a.days<1||a.days>7||!Number.isFinite(a.minutes)||a.minutes<10||a.minutes>180)return toast('Choose 1–7 training days and 10–180 minutes.');}else if(o.step===3&&a.coaching!=='coach'){a=setupReadNutrition('setup',a);const t=setupEstimate(a);if(t.error)return toast(t.error);a.target=t;}const old=clone(o);o.draft=a;o.step++;if(!persistFlows()){W.onboarding=old;return;}render();};
ACT.setupBack=()=>{W.onboarding.step=Math.max(1,W.onboarding.step-1);render();};ACT.setupSkipNutrition=()=>{const old=clone(W.onboarding);delete W.onboarding.draft.target;W.onboarding.step=4;if(!persistFlows()){W.onboarding=old;return;}render();};
function setupApplyTarget(t){Object.assign(TARGET,{kcal:t.kcal,p:t.p,c:t.c,f:t.f,by:'self',since:iso(TODAY),note:'Self-set estimate: maintenance '+t.maintenance+' kcal minus '+t.deficit+' kcal. Review against your progress.'});}
ACT.setupFinish=()=>{const o=W.onboarding,a=o.draft,oldProfile=clone(W.profile),oldTarget=clone(TARGET),oldConnected=W.connected,oldOnboarding=clone(o);W.profile={...W.profile,name:a.name,age:a.age,height:a.height,weight:a.weight,goalWeight:a.goalWeight,goal:a.goal,experience:a.experience,trainingDays:a.days,sessionMinutes:a.minutes,equipment:a.equipment,activity:a.activity,foodPreferences:a.food,trainingLimitations:a.pain};if(a.coaching==='self'){W.connected=false;if(a.target)setupApplyTarget(a.target);else Object.assign(TARGET,{kcal:0,p:0,c:0,f:0,by:'self',note:'Set your nutrition target in Food.'});}o.complete=true;o.completedAt=W.clock;if(!persistFlows()){W.profile=oldProfile;Object.assign(TARGET,oldTarget);W.connected=oldConnected;W.onboarding=oldOnboarding;return;}S.signedIn=true;S.mode='athlete';go('/');toast('Personal setup saved');};
route('/nutrition/setup',()=>{if(W.connected&&TARGET.by==='omar')return page('Coach-managed targets',`<div class="p-card"><p>Your coach manages these targets. Send a change request rather than replacing them.</p>${button('requestChange','Request a change','','p')}</div>`,'/food');const a={...W.onboarding.draft,age:W.profile.age||W.onboarding.draft.age,activity:W.profile.activity||W.onboarding.draft.activity};return page('Set your calorie target',`<div class="p-card">${field('nutrition-age','Age',a.age||'','number')}${setupSelect('nutrition-activity','Daily activity',[['1.2','Mostly sitting'],['1.375','Lightly active'],['1.55','Moderately active'],['1.725','Very active']],a.activity||'1.2')}${setupNutrition('nutrition',a)}${button('nutritionPreview','Calculate target','','p')}</div>`,'/food');});
ACT.nutritionPreview=()=>{if(W.connected&&TARGET.by==='omar')return toast('Ask your coach to change these targets');const a=setupReadNutrition('nutrition',{age:Number(val('nutrition-age')),activity:val('nutrition-activity')}),t=setupEstimate(a);if(t.error)return toast(t.error);S.ui.nutritionDraft={a,t};sheet(`<h2>Review your target</h2><p class="mt16">${t.maintenance} maintenance − ${t.deficit} deficit = <strong>${t.kcal} kcal/day</strong></p><p class="note mt16">An estimate to review against recorded progress, not a medical prescription.</p>${button('nutritionSave','Save target','','p')}`);};
ACT.nutritionSave=()=>{if(W.connected&&TARGET.by==='omar')return toast('Your coach manages the target');const draft=S.ui.nutritionDraft;if(!draft)return;const old=clone(TARGET),oldDraft=clone(W.onboarding.draft);setupApplyTarget(draft.t);W.onboarding.draft={...W.onboarding.draft,...draft.a,target:draft.t};if(!persistFlows()){Object.assign(TARGET,old);W.onboarding.draft=oldDraft;return;}closeSheet();go('/food');toast('Calorie target saved');};
replaceRoute('/food/targets',()=>page('Nutrition targets',`<div class="p-card"><h2>${W.connected&&TARGET.by==='omar'?'Coach-managed targets':'Your personal targets'}</h2><p class="mt16">${TARGET.kcal>0?TARGET.kcal+' kcal/day':'Calorie target not set'}</p>${['p','c','f'].map((k,i)=>row({t:['Protein','Carbs','Fat'][i],s:TARGET[k]>0?TARGET[k]+' g':'Not set'})).join('')}<p class="note mt16">${esc(TARGET.note||'')}</p>${W.connected&&TARGET.by==='omar'?button('requestChange','Request a change'):'<a class="btn p" href="#/nutrition/setup">Set calories from InBody or maintenance</a>'}</div>`,'/food'));
const setupSettings=ROUTES.find(r=>r.pattern==='/settings').fn;replaceRoute('/settings',(p,q)=>{const out=setupSettings(p,q),html=typeof out==='string'?out:out.html;return {...(typeof out==='string'?{}:out),html:html+`<div class="p-card mt16">${button('setupRestart','Edit personal setup')}<a class="btn s" href="#/nutrition/setup">Calorie target setup</a></div>`};});ACT.setupRestart=()=>{W.onboarding.step=1;go('/onboarding');};
// Remove every assistant entry from screens while keeping old bookmarks useful.
replaceRoute('/ask',()=>page('Coach support',`<div class="p-card"><a class="btn p" href="#/messages/coach">Message your coach</a><a class="btn s" href="#/report-pain">Report pain</a></div>`,'/'));
function stripAssistant(html){return html.replace(/<(button|a)\b[^>]*(?:data-go|href)="[^\"]*\/ask[^\"]*"[^>]*>[\s\S]*?<\/\1>/g,'').replace(/<button\b[^>]*data-act="askFrom"[^>]*>[\s\S]*?<\/button>/g,'');}
for(const r of ROUTES){const fn=r.fn;r.fn=(p,q)=>{const out=fn(p,q);if(typeof out==='string')return stripAssistant(out);return {...out,html:stripAssistant(out.html||'').replace(/Target set by <span class="gold">Omar<\/span>/g,W.connected&&TARGET.by==='omar'?'Target set by <span class="gold">Omar</span>':'Your personal target')};};}
const setupRender=render;render=()=>{setupRender();document.querySelector('.p-ai-link')?.remove?.();};window.removeEventListener('hashchange',setupRender);window.addEventListener('hashchange',render);render();

</script>
