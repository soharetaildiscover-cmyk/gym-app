document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!$('#sheet').classList.contains('show'))return;const els=[...$('#sheet').querySelectorAll('button,a,input,textarea,select,[tabindex="0"]')].filter(el=>!el.disabled&&!el.hidden),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
// A banner identifies scripted assistance without hiding the AI destinations.
const oldAsk=ROUTES.find(r=>r.pattern==='/ask')?.fn;if(oldAsk)replaceRoute('/ask',(p,q)=>{const out=oldAsk(p,q);const banner='<p class="note pad mt12" style="font-size:11px;color:var(--gold)">Demo assistant · scripted responses from sample data</p>';if(typeof out==='string')return banner+out;return{...out,html:banner+out.html};});
// Use the diary's selected date when confirming a sample scan.
const scanConfirmPrevious=ACT.scanConfirm;
ACT.scanConfirm=()=>{const date=foodDay();if(!S.scan.items.length){toast('Add at least one food before saving');return;}S.scan.type=S.scan.type||S.ui.mealType||'Lunch';const editing=!!S.scan.editId;scanConfirmPrevious();if(!editing){const m=S.meals.find(m=>m.id===S.lastScan);if(m)m.date=date;S.ui.foodDay=date;}persistPivot();};
ACT.manualSave=()=>{const values=['kcal','p','c','f'].map(k=>Number($('#mf-'+k).value||0));if(values.some(n=>!Number.isFinite(n)||n<0)||values[0]<=0){toast('Enter positive calories and non-negative macros');return;}addMeal($('#mf-name')?.value?.trim()||'Quick add',...values);};
const workoutDetailPrevious=ROUTES.find(r=>r.pattern==='/workout/:id').fn;
replaceRoute('/workout/:id',(p,q)=>{if(!p.id.startsWith('session-'))return workoutDetailPrevious(p,q);const h=HISTORY.find(h=>h.id===p.id);if(!h)return {html:hdr('Workout not found',{fb:'/history'})};return {html:`${hdr(h.name,{sub:fDay(h.date),fb:'/history'})}<section class="pad mt24"><div class="p-three"><div class="p-metric"><b>${h.min}<small> min</small></b><span>Duration</span></div><div class="p-metric"><b>${fmt(h.vol)}</b><span>Volume · kg</span></div><div class="p-metric"><b>${h.sets}</b><span>Completed sets</span></div></div>${(WORKOUT_SETS[p.id]||[]).map(([name,sets])=>`<div class="p-card mt24">${pCardHead(esc(name))}${sets.map((set,i)=>`<div class="kv"><span>Set ${i+1}</span><b>${set[0]} kg × ${set[1]}</b></div>`).join('')}</div>`).join('')}<p class="note mt24">Saved locally in your demo history.</p></section>`};});
$('#scrim').addEventListener('click',()=>{if(priorFocus?.isConnected)priorFocus.focus();priorFocus=null;});

render();

</script>
<script>
/* Audited workflow records. One browser, two demo roles; no remote account service. */
const FLOW_KEY='pivot-workflows-v2';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const freshAthlete=()=>({workouts:[],sets:{},meals:[],checkins:[],feedback:[],messages:[],reminders:[],changes:[],program:null,target:null});
let W={version:2,connected:true,clock:'2026-10-05T08:00',people:{},classes:[],pt:[],routines:[],notifications:[],measurements:[],photos:[],cardio:[],preferences:{},profile:{name:'Hassan Tarek',bio:'Build muscle'},templates:{},reminderLogs:{}};
for(const a of ROSTER)W.people[a.id]=freshAthlete();
W.classes=CLASSES.map(c=>({...clone(c),date:iso(addDays(TODAY,c.day)),start:c.time,attendees:Array.from({length:c.booked},(_,i)=>({id:'seed-'+c.id+'-'+i,name:'Sample member '+(i+1),status:'Booked'})),cancelled:false}));
W.people.hassan.messages=S.thread.filter(m=>m.t&&!m.hidden).map(m=>({id:uid(),from:m.from==='me'?'athlete':'coach',text:m.t,at:'Sample conversation'}));
W.people.hassan.reminders=clone(S.reminders).map(r=>({...r,logs:{}}));
W.templates.ul=clone(PROGRAM);
W.routines=[{id:'arms',name:'Arms + Abs finisher',ex:[['Bicep Curl',3,'12',14],['Hammer Curl',3,'12',16],['Tricep Pushdown',3,'12',30]]},{id:'hotel',name:'Hotel gym full body',ex:[['Goblet Squat',3,'12',20],['Push-Up',3,'10',0],['Dumbbell Row',3,'12',20]]}];
try{const saved=JSON.parse(localStorage.getItem(FLOW_KEY)||'null');if(saved?.version===2)W={...W,...saved};}catch{}
if(W.snapshot?.savedMeals)SAVED_MEALS.splice(0,SAVED_MEALS.length,...W.snapshot.savedMeals);
if(W.snapshot){Object.assign(S,W.snapshot.state);HISTORY.splice(0,HISTORY.length,...W.snapshot.history);Object.assign(WORKOUT_SETS,W.snapshot.sets);Object.assign(PROGRAM,W.snapshot.program);Object.assign(TARGET,W.snapshot.target);if(W.snapshot.insights)INSIGHTS.splice(0,INSIGHTS.length,...W.snapshot.insights);}
HISTORY.forEach(h=>h.date=new Date(h.date));for(const k of ['sel','calSel'])if(S.ui[k])S.ui[k]=new Date(S.ui[k]);
const nowFlow=()=>new Date(W.clock);
const person=id=>W.people[id];
const scopeBase=scopeOn;
scopeOn=(id,sc)=>!!person(id)&&(id!=='hassan'||W.connected)&&scopeBase(id,sc);
const historyFor=id=>id==='hassan'?HISTORY:person(id)?.workouts||[];
const setsFor=id=>id==='hassan'?WORKOUT_SETS:person(id)?.sets||{};
const mealsFor=id=>id==='hassan'?S.meals:person(id)?.meals||[];
const targetFor=id=>id==='hassan'?TARGET:person(id)?.target;
const programFor=id=>id==='hassan'?PROGRAM:person(id)?.program;
const field=(id,label,value='',type='text')=>`<label class="field"><span>${esc(label)}</span><input class="input" id="${id}" type="${type}" value="${esc(String(value))}"></label>`;
const val=id=>$('#'+id).value.trim();
const button=(act,label,data='',style='s')=>`<button class="btn ${style} sm" data-act="${act}" ${data}>${label}</button>`;
const page=(title,body,back='/profile')=>`${hdr(esc(title),{fb:back})}<section class="pad mt16">${body}</section>`;
const empty=text=>`<p class="note mt16">${esc(text)}</p>`;
const notifyFlow=(role,title,path,athleteId='hassan',scope=null)=>{if(athleteId==='hassan'||role==='coach')W.notifications.unshift({id:uid(),role,title,path,athleteId,scope,read:false,at:W.clock});};
function persistFlows(){if(window.pivotResetting)return false;try{W.snapshot={state:{...S,restT:undefined},history:HISTORY,sets:WORKOUT_SETS,program:PROGRAM,target:TARGET,insights:INSIGHTS,savedMeals:SAVED_MEALS};localStorage.setItem(FLOW_KEY,JSON.stringify(W));localStorage.removeItem(PIVOT_KEY);return true;}catch{toast('Storage is full or unavailable. Changes cannot survive a reload. Export your data in Settings.');return false;}}
persistPivot=persistFlows;
function commitFlow(message,path){if(!persistFlows())return false;closeSheet();if(path)go(path);else render();if(message)toast(message);return true;}
const changeFlow=(id,text,scope)=>{person(id).changes.unshift({id:uid(),text,scope,at:W.clock});notifyFlow('athlete',text,'/feedback',id,scope);};
function classStart(c){let [hm,ap]=c.start.split(' ');let [h,m]=hm.split(':').map(Number);if(ap)h=h%12+(ap==='PM'?12:0);return new Date(c.date+'T'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));}
const activeBooking=b=>['Booked','Waitlisted'].includes(b.status);
const occupancy=c=>c.attendees.filter(b=>['Booked','Attended','Missed'].includes(b.status)).length;
const mine=c=>c.attendees.find(b=>b.id==='hassan'&&activeBooking(b));
function promote(c){while(!c.cancelled&&occupancy(c)<c.cap){const b=c.attendees.find(b=>b.status==='Waitlisted');if(!b)break;b.status='Booked';if(b.id==='hassan')notifyFlow('athlete','A class spot opened: '+c.t,'/book');}}
function syncBookings(){S.bookings=[...W.classes.flatMap(c=>c.attendees.filter(b=>b.id==='hassan'&&activeBooking(b)).map(b=>({id:c.id,kind:'class',t:c.t,when:c.date+' · '+c.start,status:b.status,date:c.date}))),...W.pt.filter(b=>b.athlete==='hassan'&&b.status==='Booked').map(b=>({...b,kind:'pt',t:'PT with '+b.trainer,when:b.date+' · '+b.time,date:b.date}))];}
function classCard(c,coach=false){const b=mine(c);return `<div class="p-card mt16"><div class="p-card-head"><h2>${esc(c.t)}</h2><span class="pill">${c.cancelled?'Cancelled':occupancy(c)+' / '+c.cap}</span></div><p>${c.date} · ${c.start} · ${c.dur} min · ${esc(c.coach)}</p><p class="small mt8">${c.attendees.filter(x=>x.status==='Waitlisted').length} waiting${b?' · '+b.status:''}</p><div class="btn-row mt16">${coach?button('roster','Roster',`data-id="${c.id}"`)+(!c.cancelled?button('editClass','Edit',`data-id="${c.id}"`)+button('cancelSession','Cancel class',`data-id="${c.id}"`):''):c.cancelled?'':button('classSheet','View booking',`data-id="${c.id}"`)}</div></div>`;}
replaceRoute('/book',()=>{syncBookings();return page('Classes & PT',`${tabsBar('bookTab',[['classes','Classes'],['trainers','Trainers'],['mine','My bookings']],'classes')} ${S.ui.bookTab==='trainers'?TRAINERS.map(t=>row({t:esc(t.name),s:esc(t.spec),go:'/book/trainer/'+t.id})).join(''):S.ui.bookTab==='mine'?S.bookings.map(b=>row({t:esc(b.t),s:esc(b.when+' · '+b.status),right:button('cancelFlowBooking','Cancel',`data-id="${b.id}" data-kind="${b.kind}"`)})).join('')||empty('No active bookings.'):W.classes.filter(c=>!c.cancelled&&classStart(c)>nowFlow()).map(c=>classCard(c)).join('')||empty('No upcoming classes.')}<p class="note mt24">Demo clock: ${esc(W.clock.replace('T',' '))}. Class cancellation closes 2 hours before; PT closes 12 hours before.</p>`,'/train');});
ACT.classSheet=t=>{const c=W.classes.find(c=>c.id===t.dataset.id);if(!c)return;const b=mine(c);sheet(`<h2>${esc(c.t)}</h2><p class="mt16">${c.date} · ${c.start} · ${occupancy(c)}/${c.cap} booked</p><p class="note mt16">${b?b.status==='Waitlisted'?'Your waitlist position: '+(c.attendees.filter(x=>x.status==='Waitlisted').indexOf(b)+1):'Your place is confirmed.':'Join the waitlist when full. Vacancies promote the next person automatically.'}</p><div class="btn-row mt24">${button(b?'cancelClass':'bookClass',b?'Cancel booking':occupancy(c)>=c.cap?'Join waitlist':'Book class',`data-id="${c.id}"`,'p')}</div>`);};
ACT.bookClass=t=>{const c=W.classes.find(c=>c.id===t.dataset.id);if(!c||c.cancelled||classStart(c)<=nowFlow())return toast('This class is not open for booking');if(mine(c))return toast('You already have a booking');const status=occupancy(c)>=c.cap?'Waitlisted':'Booked';c.attendees.push({id:'hassan',name:W.profile.name,status});syncBookings();notifyFlow('coach',W.profile.name+' '+status.toLowerCase()+': '+c.t,'/coach/gym');commitFlow(status+' · saved to your calendar');};
ACT.cancelClass=t=>{const c=W.classes.find(c=>c.id===t.dataset.id),b=c&&mine(c);if(!b)return;if(b.status==='Booked'&&classStart(c)-nowFlow()<2*3600000)return toast('Cancellation window closed. Contact the gym.');b.status='Cancelled';promote(c);syncBookings();commitFlow('Booking cancelled');};
ACT.cancelFlowBooking=t=>{if(t.dataset.kind==='class')return ACT.cancelClass(t);const b=W.pt.find(b=>b.id===t.dataset.id);if(!b)return;if(new Date(b.date+'T'+b.time)-nowFlow()<12*3600000)return toast('Cancellation window closed. Contact your trainer.');b.status='Cancelled';syncBookings();commitFlow('PT booking cancelled');};
ACT.cancelBooking=t=>{const b=S.bookings[+t.dataset.i];if(b)ACT.cancelFlowBooking({dataset:{id:b.id,kind:b.kind}});};
ACT.roster=t=>{const c=W.classes.find(c=>c.id===t.dataset.id);if(!c)return;sheet(`<h2>${esc(c.t)} · roster</h2>${c.attendees.map((b,i)=>row({t:esc(b.name),s:b.status,right:b.status==='Booked'?button('attend','Attended',`data-id="${c.id}" data-i="${i}"`)+button('missed','Missed',`data-id="${c.id}" data-i="${i}"`):''})).join('')}<p class="note mt16">Attendance opens after the session ends. Sample members are seeded demo entries.</p>`);};
function attendance(t,status){const c=W.classes.find(c=>c.id===t.dataset.id),b=c?.attendees[+t.dataset.i];if(!c||!b||b.status!=='Booked'||c.cancelled)return;if(+nowFlow()<+classStart(c)+c.dur*60000)return toast('Attendance opens when the class ends');b.status=status;if(status==='Attended'&&b.id==='hassan'&&!HISTORY.some(h=>h.id==='class-'+c.id))HISTORY.unshift({id:'class-'+c.id,name:c.t,date:new Date(c.date+'T12:00'),min:c.dur,vol:0,sets:0,pr:false,kind:'class'});syncBookings();persistFlows();ACT.roster(t);}
ACT.attend=t=>attendance(t,'Attended');ACT.missed=t=>attendance(t,'Missed');
ACT.newClass=()=>ACT.editClass({dataset:{id:'new'}});
ACT.editClass=t=>{const c=W.classes.find(c=>c.id===t.dataset.id)||{id:'new',t:'',date:iso(TODAY),start:'18:00',dur:45,cap:12};S.ui.classEdit=c.id;sheet(`<h2>${c.id==='new'?'Create':'Edit'} class</h2>${field('wc-name','Name',c.t)}${field('wc-date','Date',c.date,'date')}${field('wc-time','Time',c.id==='new'?'18:00':classStart(c).toTimeString().slice(0,5),'time')}${field('wc-dur','Minutes',c.dur,'number')}${field('wc-cap','Capacity',c.cap,'number')}<p class="note">One dated session. Existing attendees keep their bookings after an edit.</p>${button('classMade','Save class','','p')}`);};
ACT.classMade=()=>{const old=W.classes.find(c=>c.id===S.ui.classEdit),c={id:old?.id||uid(),t:val('wc-name'),date:val('wc-date'),start:val('wc-time'),dur:+val('wc-dur'),cap:+val('wc-cap'),coach:old?.coach||'Omar',attendees:old?.attendees||[],cancelled:false};if(!c.t||!Number.isInteger(c.cap)||c.cap<1||!Number.isFinite(c.dur)||c.dur<5||!Number.isFinite(+classStart(c))||classStart(c)<=nowFlow()||c.cap<occupancy(c))return toast('Use a future date, positive duration, and capacity at least equal to confirmed bookings');if(old)Object.assign(old,c);else W.classes.push(c);promote(old||c);syncBookings();if(c.attendees.some(b=>b.id==='hassan'&&activeBooking(b)))notifyFlow('athlete','Class updated: '+c.t,'/book');commitFlow('Class saved');};
ACT.cancelSession=t=>{const c=W.classes.find(c=>c.id===t.dataset.id);if(!c||c.cancelled)return;if(classStart(c)<=nowFlow())return toast('Past sessions cannot be cancelled');c.cancelled=true;c.attendees.filter(activeBooking).forEach(b=>{b.status='Cancelled';if(b.id==='hassan')notifyFlow('athlete','Class cancelled: '+c.t,'/book');});syncBookings();commitFlow('Class cancelled; bookings updated');};
replaceRoute('/coach/gym',()=>page('Gym schedule',`${button('newClass','Create class','','p')} ${button('demoClock','Demo clock')}<p class="note mt16">Demo staff view · classes and PT share the athlete booking records.</p>${W.classes.map(c=>classCard(c,true)).join('')}<h2 class="mt24">PT bookings</h2>${W.pt.map(b=>row({t:esc(b.trainer+' · '+b.date+' '+b.time),s:esc(b.status+' · '+W.profile.name)})).join('')||empty('No PT bookings.')}`,'/coach'));
ACT.demoClock=()=>sheet(`<h2>Demo clock</h2><p class="note mt16">Move sample time forward to test cancellation windows and attendance.</p>${field('flow-clock','Sample date and time',W.clock,'datetime-local')}${button('saveClock','Set demo time','','p')}`);
ACT.saveClock=()=>{const v=val('flow-clock');if(!Number.isFinite(+new Date(v)))return toast('Enter a valid date');W.clock=v;commitFlow('Demo clock updated');};
replaceRoute('/book/trainer/:id',p=>{const tr=TRAINERS.find(t=>t.id===p.id);if(!tr)return page('Trainer not found','');const date=S.ui.flowPtDate||iso(addDays(TODAY,1));return page('Book PT',`<h2>${esc(tr.name)}</h2>${field('pt-date','Date',date,'date')}${button('ptDate','Show available times')}<div class="optgrid mt16">${['07:00','08:00','12:00','17:00','18:00','19:00'].map(time=>{const taken=W.pt.some(b=>b.trainerId===p.id&&b.date===date&&b.time===time&&b.status==='Booked');return `<button class="opt" ${taken?'disabled':`data-act="bookPtFlow" data-id="${p.id}" data-date="${date}" data-time="${time}"`}>${time}${taken?' · Taken':''}</button>`;}).join('')}</div><p class="note mt16">60 minutes · payment arranged with the gym. Cancellation closes 12 hours before.</p>`,'/book');});
ACT.ptDate=()=>{S.ui.flowPtDate=val('pt-date');render();};
ACT.bookPtFlow=t=>{const {id,date,time}=t.dataset,tr=TRAINERS.find(x=>x.id===id);if(!tr||new Date(date+'T'+time)<=nowFlow())return toast('Choose a future slot');if(W.pt.some(b=>b.status==='Booked'&&b.date===date&&b.time===time&&(b.trainerId===id||b.athlete==='hassan')))return toast('This time is already booked');W.pt.push({id:uid(),trainerId:id,trainer:tr.name,athlete:'hassan',date,time,status:'Booked'});syncBookings();notifyFlow('coach','New PT booking: '+date+' '+time,'/coach/gym');commitFlow('PT booked','/book');};
const upcomingFlow=()=>{syncBookings();return S.bookings.map(b=>row({t:esc(b.t),s:esc(b.when+' · '+b.status),go:'/book'})).join('');};
const homeFlow=ROUTES.find(r=>r.pattern==='/').fn;
replaceRoute('/',(p,q)=>{const out=homeFlow(p,q);out.html+=`<section class="p-card mt24">${pCardHead('Upcoming bookings','All','/book')}${upcomingFlow()||empty('Book a class or PT session to see it here.')}</section>`;return out;});
replaceRoute('/calendar',()=>page('Your calendar',`${HISTORY.map(h=>row({t:esc(h.name),s:fDay(new Date(h.date))+' · completed',go:'/workout/'+h.id})).join('')}<h2 class="mt24">Bookings</h2>${upcomingFlow()||empty('No upcoming bookings.')}<h2 class="mt24">Joined events</h2>${EVENTS.filter(e=>S.joinedEvents[e.id]).map(e=>row({t:esc(e.t||e.name||'Event'),go:'/events'})).join('')||empty('No events joined.')}`,'/train'));
function threadPage(id,coach){const a=person(id);if(!a)return page('Athlete not found','');if(id==='hassan'&&!W.connected)return page('Coaching ended',empty('Reconnect before sending new messages.'));return page(coach?athlete(id).name:'Omar Nabil',`${a.messages.map(m=>`<div class="p-card mt16"><div class="p-label">${m.from==='coach'?'Omar':esc(id==='hassan'?W.profile.name:athlete(id).name)} · ${esc(m.at)}</div><p class="mt8" style="white-space:pre-wrap">${esc(m.text)}</p></div>`).join('')||empty('Start this conversation.')}<label class="field"><span>Message</span><textarea id="flow-message" class="input"></textarea></label>${button('flowMessage','Send',`data-id="${id}" data-role="${coach?'coach':'athlete'}"`,'p')}`,coach?'/coach/messages':'/messages');}
replaceRoute('/messages/coach',()=>threadPage('hassan',false));replaceRoute('/coach/messages/:id',p=>threadPage(p.id,true));
replaceRoute('/messages',()=>page('Messages',row({t:'Omar Nabil',s:esc(person('hassan').messages.at(-1)?.text||'Start a conversation'),go:'/messages/coach'}),'/'));
replaceRoute('/coach/messages',()=>page('Messages',ROSTER.map(a=>row({t:esc(a.name),s:esc(person(a.id).messages.at(-1)?.text||'No messages'),go:'/coach/messages/'+a.id})).join(''),'/coach'));
ACT.flowMessage=t=>{const {id,role}=t.dataset,text=val('flow-message');if(!text||!person(id)||id==='hassan'&&!W.connected)return;person(id).messages.push({id:uid(),from:role,text,at:W.clock.replace('T',' ')});notifyFlow(role==='coach'?'athlete':'coach','New message',role==='coach'?'/messages/coach':'/coach/messages/'+id,id);commitFlow('Message saved to the shared thread');};
function workoutsHtml(id,coach=false){return historyFor(id).map(h=>row({t:esc(h.name),s:fDay(new Date(h.date))+' · '+h.sets+' sets · '+fmt(h.vol)+' kg',go:coach?`/coach/athlete/${id}/workout/${h.id}`:'/workout/'+h.id})).join('')||empty('No workouts logged for this athlete.');}
function detailFlow(id,wid,coach=false){if(coach&&!scopeOn(id,'TRAINING'))return page('Training private',empty('This athlete has not shared training.'));const h=historyFor(id).find(h=>h.id===wid);if(!h)return page('Workout not found',empty('This workout does not belong to this athlete.'));return page(h.name,`<p>${fDay(new Date(h.date))} · ${h.min} min · ${fmt(h.vol)} kg · ${h.sets} sets</p>${(setsFor(id)[wid]||[]).map(([name,sets])=>`<div class="p-card mt16"><h2>${esc(name)}</h2>${sets.map((s,i)=>`<div class="kv"><span>Set ${i+1}</span><b>${s[0]} kg × ${s[1]}${Number.isFinite(Number(s[2]))&&s[2]!=null?' · RPE '+s[2]:''}</b></div>`).join('')}</div>`).join('')||empty(h.kind==='class'?'Attendance recorded.':h.kind==='cardio'?'Cardio session recorded.':'This older sample has summary data only; no set details were stored.')}${coach?button('feedback','Leave feedback',`data-id="${id}" data-ref="${wid}"`):''}${person(id).feedback.filter(f=>f.ref===wid).map(f=>`<p class="callout mt16">Omar: ${esc(f.text)}</p>`).join('')}`,coach?'/coach/athlete/'+id+'/training':'/history');}
const previousWorkoutFlow=ROUTES.find(r=>r.pattern==='/workout/:id').fn;
replaceRoute('/workout/:id',(p,q)=>p.id==='new'?previousWorkoutFlow(p,q):detailFlow('hassan',p.id));
replaceRoute('/coach/athlete/:id/workout/:wid',p=>detailFlow(p.id,p.wid,true));
function coachAthleteFlow(id,tab='overview'){if(!person(id))return page('Athlete not found','');const title=athlete(id).name;const tabs=[['overview','Overview'],['training','Training'],['nutrition','Nutrition'],['progress','Progress'],['checkins','Check-ins'],['timeline','Timeline'],['targets','Targets'],['assign','Assign'],['reminders','Reminders']];const head=`<div class="chips">${tabs.map(([k,v])=>`<a class="chip" href="#/coach/athlete/${id}/${k}">${v}</a>`).join('')}</div>`;const sc={training:'TRAINING',nutrition:'NUTRITION',targets:'NUTRITION',progress:'PROGRESS',checkins:'CHECKINS',assign:'TRAINING',reminders:'REMINDERS'}[tab];if((id==='hassan'&&!W.connected)||(sc&&!scopeOn(id,sc)))return page(title,head+empty('Not shared with this coach.'),'/coach/athletes');let body='';
if(tab==='training')body=workoutsHtml(id,true);
else if(tab==='nutrition'){const dates=[...new Set(mealsFor(id).map(m=>m.date))].sort().reverse();body=dates.map(d=>row({t:d,s:pTotals(mealsFor(id).filter(m=>m.date===d)).kcal+' kcal',go:`/coach/athlete/${id}/day/${d}`})).join('')||empty('No meals logged.');}
else if(tab==='progress')body=id==='hassan'?W.measurements.map(m=>row({t:esc(m.name),s:m.value+' '+esc(m.unit)+' · '+m.date})).join('')||empty('No new measurements recorded.'):empty('No measurements recorded.');
else if(tab==='checkins')body=person(id).checkins.map(c=>row({t:c.date,s:c.review?'Reviewed':'Awaiting review',go:'/coach/checkin/'+id})).join('')||empty('No submitted check-ins.');
else if(tab==='timeline')body=person(id).changes.filter(c=>!c.scope||scopeOn(id,c.scope)).map(c=>row({t:esc(c.text),s:c.at})).join('')||empty('No shared changes yet.');
else if(tab==='targets'){const t=targetFor(id)||{kcal:2200,p:140,c:260,f:67,water:2.5};body=['kcal','p','c','f','water'].map(k=>field('target-'+k,{kcal:'Calories',p:'Protein g',c:'Carbs g',f:'Fat g',water:'Water L'}[k],t[k],'number')).join('')+button('saveTargetsFlow','Save targets',`data-id="${id}"`,'p');}
else if(tab==='assign')body=Object.values(W.templates).map(p=>row({t:esc(p.name),s:Object.keys(p.days).length+' training days',right:button('assignFlow','Assign now',`data-id="${id}" data-pid="${p.id}"`)})).join('')+empty('Assignments copy this template into the athlete’s plan. Edit templates in Coach → Plans.');
else if(tab==='reminders')body=remindersHtml(id,true);
else body=`${scopeOn(id,'TRAINING')?row({t:'Training',s:historyFor(id).length+' logged sessions · '+esc(programFor(id)?.name||'No program'),go:'/coach/athlete/'+id+'/training'}):empty('Training not shared')}${scopeOn(id,'NUTRITION')?row({t:'Nutrition',s:mealsFor(id).length+' logged meals',go:'/coach/athlete/'+id+'/nutrition'}):empty('Nutrition not shared')}${scopeOn(id,'CHECKINS')?row({t:'Check-ins',s:person(id).checkins.length+' submissions',go:'/coach/athlete/'+id+'/checkins'}):empty('Check-ins not shared')}${row({t:'Message athlete',go:'/coach/messages/'+id})}`;
return page(title,head+body,'/coach/athletes');}
replaceRoute('/coach/athlete/:id',p=>coachAthleteFlow(p.id));replaceRoute('/coach/athlete/:id/:tab',p=>coachAthleteFlow(p.id,p.tab));
replaceRoute('/coach/athlete/:id/day/:day',p=>scopeOn(p.id,'NUTRITION')?page(p.day,mealsFor(p.id).filter(m=>m.date===p.day).map(m=>row({t:esc(m.name),s:`${m.kcal} kcal · P${m.p} C${m.c} F${m.f}`,right:button('feedback','Feedback',`data-id="${p.id}" data-ref="${m.id}"`)})).join('')||empty('No meals on this date.')):page('Nutrition private',''));

ACT.saveProgramFlow=t=>{const pr=clone(W.templates[t.dataset.id]);pr.name=val('program-name');let valid=!!pr.name;Object.values(pr.days).forEach((d,i)=>d.ex.forEach((e,j)=>{e[0]=val('pe-'+i+'-'+j+'-n');e[1]=+val('pe-'+i+'-'+j+'-s');e[2]=val('pe-'+i+'-'+j+'-r');e[3]=+val('pe-'+i+'-'+j+'-w');if(!e[0]||!Number.isInteger(e[1])||e[1]<1||e[1]>30||!/^\d+(?:[–-]\d+)?$/.test(e[2])||!Number.isFinite(e[3])||e[3]<0)valid=false;}));if(!valid)return toast('Check exercise names, sets, reps and weights');for(let i=0;i<7;i++)pr.schedule[i]=val('schedule-'+i)||null;W.templates[pr.id]=pr;commitFlow('Template saved');};

replaceRoute('/profile',()=>{let html=profileFlow();html=html.replace('Hassan Tarek',esc(W.profile.name)).replace('@hassan · Build muscle','@hassan · '+esc(W.profile.bio));html=html.replace(/<div class="p-card"><div class="p-card-head"><h2>Strength, over time[\s\S]*?Illustrative demo trend<\/p><\/div>/,`<div class="p-card">${pCardHead('Your logged strength','Progress','/progress')}${Object.entries(recordsFlow()).slice(0,3).map(([n,r])=>row({t:esc(n),s:r.kg+' kg × '+r.reps})).join('')}</div>`);html=html.replace('<b>6</b><span>Progress photos</span>',`<b>${W.photos.length}</b><span>Progress photos</span>`);return html;});
replaceRoute('/profile/edit',()=>page('Edit profile',`${field('profile-name','Name',W.profile.name)}${field('profile-bio','Goal / bio',W.profile.bio)}${button('saveProfileFlow','Save profile','','p')}`));

replaceRoute('/settings/notifications',()=>page('Notification preferences',['Messages','Bookings','Check-ins','Plan changes'].map(k=>row({t:k,s:W.preferences[k]===false?'Muted in-app':'Enabled in-app',right:button('toggleFlowPreference',W.preferences[k]===false?'Enable':'Mute',`data-key="${k}"`)})).join('')+empty('These preferences control the in-app inbox. Push and email are not connected.'),'/settings'));
ACT.toggleFlowPreference=t=>{const k=t.dataset.key;W.preferences[k]=W.preferences[k]===false;commitFlow('Preference saved');};
function notificationsFlow(role){const list=W.notifications.filter(n=>n.role===role&&(role!=='coach'||!n.scope||scopeOn(n.athleteId,n.scope))).filter(n=>{const k=/message/i.test(n.title)?'Messages':/book|class|PT/i.test(n.title)?'Bookings':/check-in/i.test(n.title)?'Check-ins':'Plan changes';return W.preferences[k]!==false;});return page('Notifications',button('readFlowNotifications','Mark all read',`data-role="${role}"`)+list.map(n=>row({t:esc(n.title),s:(n.read?'Read':'New')+' · '+n.at,go:n.path})).join('')||empty('No notifications.'));}
replaceRoute('/notifications',()=>notificationsFlow('athlete'));replaceRoute('/coach/notifications',()=>notificationsFlow('coach'));
ACT.readFlowNotifications=t=>{W.notifications.filter(n=>n.role===t.dataset.role).forEach(n=>n.read=true);S.notifRead=true;commitFlow('Notifications marked read');};
replaceRoute('/coach-connect',()=>page('My coach',W.connected?`${row({t:'Omar Nabil',s:'Connected in this demo',go:'/messages/coach'})}${row({t:'Sharing permissions',go:'/settings/coach-access'})}${button('endCoachFlow','End coaching')}`:`${empty('Coaching has ended. Historical records remain yours. Coach access is disabled.')}${button('reconnectFlow','Reconnect demo coach')}`));
ACT.endCoachFlow=()=>sheet(`<h2>End coaching?</h2><p class="note mt16">Omar loses access to your shared records and new messaging. Your history and current plan stay with you.</p>${button('confirmEndCoachFlow','End coaching','','d')}`);
ACT.confirmEndCoachFlow=()=>{W.connected=false;commitFlow('Coaching ended','/coach-connect');};ACT.reconnectFlow=()=>{W.connected=true;commitFlow('Demo coach reconnected');};
replaceRoute('/premium',()=>page('Demo membership',`<h2>${esc(S.membership.status)}</h2><p class="note mt16">This is a local demonstration. No payment or subscription is charged.</p>${button('cancelMembershipFlow',S.membership.status==='CANCELLED'?'Restart demo trial':'Cancel demo trial')}`));ACT.cancelMembershipFlow=()=>{S.membership.status=S.membership.status==='CANCELLED'?'TRIAL':'CANCELLED';commitFlow('Demo membership updated');};
const oldSettingsFlow=ROUTES.find(r=>r.pattern==='/settings').fn;
replaceRoute('/settings',()=>page('Settings',`${row({t:'Edit profile',go:'/profile/edit'})}${row({t:'Coach access',go:'/settings/coach-access'})}${row({t:'Notification preferences',go:'/settings/notifications'})}${row({t:'Demo membership',go:'/premium'})}${button('switchMode','Switch to coach', 'data-mode="coach"')} ${button('exportFlow','Export my demo data')} ${button('resetDemo','Reset demo')}<p class="note mt24">Weights use kg; distances use km. Health sync, payments, AI recognition, and push notifications are not connected.</p>`));
ACT.exportFlow=()=>{const blob=new Blob([JSON.stringify(W,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pivot-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
ACT.resetConfirmed=()=>{localStorage.removeItem(FLOW_KEY);localStorage.removeItem(PIVOT_KEY);location.reload();};
// Never imply unsupported controls completed a mutation.
ACT.soon=t=>toast('Not connected in this demo'+(t.dataset.msg?' · '+t.dataset.msg:''));

syncBookings();

window.removeEventListener('hashchange',renderBeforeFlows);window.addEventListener('hashchange',render);
window.addEventListener('pagehide',persistFlows);
render();
// Community content is entered and stored, not synthesized from a fixed workout.
ACT.compose=()=>sheet(`<h2>New post</h2><label class="field"><span>Your update</span><textarea class="input" id="post-text"></textarea></label><label class="field"><span>Attach workout (optional)</span><select class="input" id="post-workout"><option value="">No workout</option>${HISTORY.map(h=>`<option value="${h.id}">${esc(h.name)} · ${fDay(new Date(h.date))}</option>`).join('')}</select></label><label class="field"><span>Audience label</span><select class="input" id="post-audience"><option value="FOLLOWERS">Followers</option><option value="GYM">Gym</option><option value="PUBLIC">Public</option></select></label><p class="note mt16">Posts stay in this browser’s demo community. Audience labels do not publish to other people.</p>${button('postIt','Post','','p')}`);
ACT.postIt=()=>{const text=val('post-text'),h=HISTORY.find(h=>h.id===val('post-workout')),aud=val('post-audience');if(!text&&!h)return toast('Write an update or choose a workout');const p={id:uid(),who:esc(W.profile.name),uid:'hassan',ago:'now',kind:h?'WORKOUT':'COACH',title:esc(h?.name||'Training update'),txt:esc(text),aud:['PUBLIC','FOLLOWERS','GYM'].includes(aud)?aud:'FOLLOWERS',likes:0};if(h){p.time=h.min+' min';p.vol=fmt(h.vol)+' kg';p.sets=h.sets;p.workoutId=h.id;p.rows=(WORKOUT_SETS[h.id]||[]).map(([n,s])=>[esc(n),s.length+' × '+s[0][1],s[0][0]+' kg']);}S.posts.unshift(p);S.comments[p.id]=[];S.ui.feed='for-you';commitFlow('Posted in your local demo','/community');};
ACT.saveWorkout=(t,e)=>{e?.stopPropagation();const p=S.posts.find(p=>p.id===t.dataset.id);if(!p?.rows?.length)return toast('No exercises to save');if(W.routines.some(r=>r.source===p.id))return toast('Already in My routines');const ex=p.workoutId?(WORKOUT_SETS[p.workoutId]||[]).map(([n,ss])=>[n,ss.length,String(ss[0][1]),ss[0][0]]):p.rows.map(r=>[r[0],Math.max(1,parseInt(r[1])||3),String(r[1].split('×')[1]||'10').trim(),parseFloat(r[2])||0]);W.routines.push({id:uid(),source:p.id,name:p.title,ex});commitFlow('Saved to My routines');};
ACT.sharePost=(t,e)=>{e?.stopPropagation();S.ui.sharePost=t.dataset.id;sheet(`<h2>Share post link</h2><p class="note mt16">This private demo’s posts exist only in this browser. The link opens here; it does not copy your post to another account.</p>${button('copyLink','Copy local post link')}`);};
ACT.copyLink=async()=>{const url=location.origin+location.pathname+'#/post/'+S.ui.sharePost;try{await navigator.clipboard.writeText(url);toast('Link copied');}catch{sheet(`<h2>Copy this link</h2>${field('copy-url','Link',url)}`);}};
ACT.shareOut=ACT.copyLink;ACT.shareSheet=ACT.compose;ACT.shareDone=()=>ACT.postIt();
const postDetailFlow=ROUTES.find(r=>r.pattern==='/post/:id').fn;
replaceRoute('/post/:id/media',(p,q)=>postDetailFlow(p,q));
replaceRoute('/athlete/:id',p=>{const u=PEOPLE[p.id];if(!u)return page('Profile not found','');const me=p.id==='hassan';return page(me?W.profile.name:u.name,`${empty(me?W.profile.bio:u.bio)}${me?row({t:'Edit profile',go:'/profile/edit'}):''}<h2 class="mt24">Shared posts</h2>${S.posts.filter(x=>x.uid===p.id&&(x.aud==='PUBLIC'||me)&&(!me||S.privacy.shareWorkouts||!x.workoutId)).map(p=>postCard(p)).join('')||empty('No shared posts.')}<p class="note mt16">Private body stats, nutrition, and check-ins are excluded.</p>`,'/community');});
ACT.insSend=t=>{const i=insight(t.dataset.id);if(!i||!W.connected||!['new','draft'].includes(i.status))return;i.status='sent';notifyFlow('coach','Hassan sent an insight','/coach','hassan',i.domain==='Nutrition'?'NUTRITION':'TRAINING');commitFlow('Sent to coach');};
ACT.insApplied=t=>{const i=insight(t.dataset.id);if(!i||i.id!=='i3')return;if(!person('hassan').reminders.some(r=>r.id==='insight-wind-down'))person('hassan').reminders.push({id:'insight-wind-down',t:'Wind down',time:'22:30',when:'Daily · 22:30',logs:{}});i.status='applied';commitFlow('Wind-down reminder saved');};
ACT.coachDecide=t=>{const i=insight(t.dataset.id);if(!i||i.status!=='sent'||!scopeOn('hassan',i.domain==='Nutrition'?'NUTRITION':'TRAINING'))return;if(t.dataset.v==='approved'){if(i.id==='i2')TARGET.p=246;else{const name=i.id==='i1'?'Incline DB Press':i.id==='i4'?'Back Squat':null;const e=Object.values(PROGRAM.days).flatMap(d=>d.ex).find(e=>e[0]===name);if(!e)return toast('Exercise is not in the assigned program');e[3]=i.id==='i1'?37.5:152.5;if(i.id==='i1')e[2]='6–8';}}i.status=t.dataset.v==='approved'?'approved':'kept';changeFlow('hassan','Coach '+i.status+': '+i.short,i.domain==='Nutrition'?'NUTRITION':'TRAINING');commitFlow('Decision saved; current plan updated when approved');};
const coachHomeFlow=ROUTES.find(r=>r.pattern==='/coach').fn;
replaceRoute('/coach',()=>coachHomeFlow()+INSIGHTS.filter(i=>i.status==='sent'&&scopeOn('hassan',i.domain==='Nutrition'?'NUTRITION':'TRAINING')).map(i=>insightDecisionBlock(i)).join(''));
for(const path of ['/insights','/insights/:id','/review']){const old=ROUTES.find(r=>r.pattern===path).fn;replaceRoute(path,(p,q)=>{const out=old(p,q),note='<p class="callout pad mt16">Sample analysis · these insights use seeded example evidence, not a live analysis of your new logs. Decisions and approved changes are saved.</p>';if(typeof out==='string')return note+out;return {...out,html:note+out.html};});}
replaceRoute('/timeline',()=>page('Change history',person('hassan').changes.map(c=>row({t:esc(c.text),s:c.at})).join('')||empty('No new changes yet.')));
replaceRoute('/progress/compare',()=>page('Compare photos',W.photos.length<2?empty('Add at least two progress photos to compare.'): `<div class="pgrid">${W.photos.slice(-2).map(p=>`<div><img src="${p.data}" alt="Progress ${p.date}" style="width:100%"><p>${p.date}</p></div>`).join('')}</div>`,'/progress'));
replaceRoute('/exercise/:name',p=>{const name=p.name;const logs=HISTORY.flatMap(h=>(WORKOUT_SETS[h.id]||[]).filter(e=>e[0]===name).map(e=>({h,sets:e[1]})));return page(name,`${empty('Exercise history from your recorded sets. Video tutorials and form analysis are not connected in this demo.')}${logs.map(({h,sets})=>`<div class="p-card mt16"><h2>${fDay(new Date(h.date))}</h2>${sets.map((s,i)=>row({t:'Set '+(i+1),s:s[0]+' kg × '+s[1]})).join('')}</div>`).join('')||empty('No sets recorded yet.')}`,'/exercises');});
replaceRoute('/achievements',()=>page('Achievements',row({t:'First logged workout',s:HISTORY.length?'Unlocked':'Not yet'})+row({t:'10 logged workouts',s:HISTORY.length>=10?'Unlocked':HISTORY.length+' / 10'})+row({t:'100,000 kg total volume',s:fmt(HISTORY.reduce((n,h)=>n+h.vol,0))+' / 100,000 kg'})));
const trainDisplayFlow=ROUTES.find(r=>r.pattern==='/train').fn;
replaceRoute('/train',(p,q)=>{const out=trainDisplayFlow(p,q);if(typeof out==='string')return out;return {...out,html:out.html.replace('Upper / Lower Strength',esc(PROGRAM.name))};});
pCoach=()=>`<div class="p-card">${pCardHead('Your coach','Manage','/coach-connect')}${W.connected?`${row({t:'Omar Nabil',s:'Your demo coach',go:'/messages/coach'})}<p class="note mt12">${esc(person('hassan').feedback[0]?.text||'Send a message or check-in to start a conversation.')}</p>`:empty('No active coaching connection.')}</div>`;
render();
replaceRoute('/programs',()=>page('Programs',Object.values(W.templates).map(p=>row({t:esc(p.name),s:Object.keys(p.days).length+' sessions',go:'/programs/'+p.id})).join(''),'/train'));
replaceRoute('/programs/:id',p=>{const pr=W.templates[p.id];if(!pr)return page('Program not found','');return page(pr.name,Object.entries(pr.days).map(([name,d])=>`<div class="p-card mt16"><h2>${esc(name)}</h2>${d.ex.map(e=>row({t:esc(e[0]),s:e[1]+' × '+esc(String(e[2]))+' · '+e[3]+' kg'})).join('')}${button('startCatalogFlow','Start this session',`data-id="${p.id}" data-day="${esc(name)}"`,'p')}</div>`).join(''),'/programs');});
ACT.startCatalogFlow=t=>{const p=W.templates[t.dataset.id],d=p?.days[t.dataset.day];if(!d)return;if(S.live)return go('/log');S.live=Date.now();S.liveDay=t.dataset.day;S.sets={};S.sessionPlan=clone({...d,name:t.dataset.day});persistFlows();go('/log');};
const finishBeforeFlow=ACT.confirmFinish;
ACT.confirmFinish=()=>{const before=recordsFlow(),n=HISTORY.length;finishBeforeFlow();if(HISTORY.length>n){const h=HISTORY[0];h.pr=(WORKOUT_SETS[h.id]||[]).some(([name,ss])=>ss.some(([kg,reps])=>kg>0&&before[name]&&kg*(1+reps/30)>before[name].score));if(S.lastDone)S.lastDone.pr=h.pr;notifyFlow('coach','Hassan completed '+h.name,'/coach/athlete/hassan/workout/'+h.id,'hassan','TRAINING');persistFlows();}};
// Show uploaded photos only with the independent photo scope.
const coachAthleteRoute=ROUTES.find(r=>r.pattern==='/coach/athlete/:id/:tab').fn;
replaceRoute('/coach/athlete/:id/:tab',(p,q)=>{const out=coachAthleteRoute(p,q);if(p.tab!=='progress'||p.id!=='hassan'||!scopeOn(p.id,'PROGRESS'))return out;return out+(scopeOn(p.id,'PHOTOS')?`<section class="pad"><h2>Shared photos</h2><div class="pgrid">${W.photos.map(p=>`<img src="${p.data}" alt="Progress ${p.date}" style="width:100%">`).join('')}</div></section>`:'<p class="note pad">Progress photos are not shared.</p>');});
render();

</script>
<script>
/* Health UX preview and real local Story image exports. No native health bridge. */
const healthNames={apple:'Apple Health',google:'Health Connect'};
W.health=W.health||{providers:{},seen:{},lastResult:null};
for(const id of Object.keys(healthNames))W.health.providers[id]=W.health.providers[id]||{enabled:false,workouts:true,distance:true,energy:false,heart:false,lastSync:null};
const healthSourceLabel=h=>h.source?`${healthNames[h.source]||h.source}${h.sample?' · Sample':''}`:'PIVOT';
route('/settings/connections',()=>page('Connected apps',`<div class="p-card"><div class="p-label">HEALTH CONNECTIONS</div><h2 class="mt12">Your activity, together.</h2><p class="note mt12">Real Apple Health and Health Connect syncing requires the native PIVOT app. This website lets you preview permissions and import sample activity. No health account is connected.</p></div>${Object.entries(healthNames).map(([id,name])=>{const p=W.health.providers[id];return `<div class="p-card mt16"><div class="p-card-head"><h2>${name}</h2><span class="pill">${p.enabled?'Preview enabled':'Not connected'}</span></div><p class="small">${id==='apple'?'iPhone & Apple Watch':'Android'} · ${p.lastSync?'Last sample import: '+new Date(p.lastSync).toLocaleString():'No sample imports yet'}</p><div class="btn-row mt16">${button('healthSetup','Preview permissions',`data-id="${id}"`)}${p.enabled?button('healthImport','Import sample workout',`data-id="${id}"`,'p')+button('healthDisconnect','Turn off preview',`data-id="${id}"`):''}</div></div>`;}).join('')}${W.health.lastResult?`<p class="callout mt16" role="status">${esc(W.health.lastResult)}</p>`:''}<div class="p-card mt16"><h2>You stay in control</h2><p class="note mt12">Imported activity appears in Home, history and your calendar. Repeat imports of the same source record are skipped. Turning off the preview keeps existing imports; remove them separately below. Your coach’s training-sharing permission also applies to imported activity.</p>${button('healthClear','Remove sample imports')}</div>`,'/settings'));
ACT.healthSetup=t=>{const id=t.dataset.id,p=W.health.providers[id];if(!p)return;sheet(`<h2>${healthNames[id]} permissions preview</h2><p class="note mt12">These are demo choices, not system permissions. Real access will be requested by the native app.</p>${[['workouts','Workouts & duration'],['distance','Distance'],['energy','Active calories'],['heart','Average heart rate']].map(([k,label])=>`<label class="row"><input type="checkbox" id="health-${k}" ${p[k]?'checked':''}><span>${label}</span></label>`).join('')}<div class="btn-row mt24">${button('healthSave','Enable sample preview',`data-id="${id}"`,'p')}</div>`);};
ACT.healthSave=t=>{const p=W.health.providers[t.dataset.id];if(!p)return;for(const k of ['workouts','distance','energy','heart'])p[k]=!!$('#health-'+k).checked;p.enabled=true;commitFlow('Sample permissions saved');};
function importHealthSample(id){const p=W.health.providers[id];if(!p?.enabled)return {ok:false,message:'Enable this provider’s sample preview first.'};if(!p.workouts)return {ok:false,message:'Workouts are off in preview permissions. Enable them and retry.'};const externalId='sample-walk-2026-10-05',key=id+':'+externalId;if(W.health.seen[key])return {ok:true,message:'No new records. This sample has already been imported.'};const existing=HISTORY.find(h=>h.activityType==='walking'&&+new Date(h.date)===+new Date('2026-10-05T07:00:00')&&h.min===32);if(existing){W.health.seen[key]=existing.id;return {ok:true,message:'Matching sample activity already exists. Kept one workout in history.'};}const h={id:'health-'+id+'-'+externalId,externalId,source:id,sample:true,name:'Outdoor walk',activityType:'walking',date:new Date('2026-10-05T07:00:00'),min:32,kind:'health',vol:0,sets:0,pr:false};if(p.distance)h.km=2.8;if(p.energy)h.kcal=165;if(p.heart)h.heartRate=112;HISTORY.unshift(h);W.health.seen[key]=h.id;return {ok:true,message:'Imported one sample walk from '+healthNames[id]+'. No real health data was accessed.'};}
ACT.healthImport=t=>{const id=t.dataset.id,result=importHealthSample(id);W.health.lastResult=result.message;if(result.ok)W.health.providers[id].lastSync=new Date().toISOString();commitFlow(result.message);};
ACT.healthDisconnect=t=>{const p=W.health.providers[t.dataset.id];if(!p)return;p.enabled=false;W.health.lastResult='Preview disabled. Existing imports are kept in history.';commitFlow('Preview disabled');};
ACT.healthClear=()=>{for(let i=HISTORY.length-1;i>=0;i--)if(HISTORY[i].kind==='health'&&HISTORY[i].sample)HISTORY.splice(i,1);W.health.seen={};W.health.lastResult='Sample health imports removed. Your PIVOT workouts were kept.';commitFlow('Sample imports removed');};
const connectedSettings=ROUTES.find(r=>r.pattern==='/settings').fn;
replaceRoute('/settings',()=>connectedSettings()+`<section class="pad mt16">${row({icon:'heartbeat',t:'Connected apps',s:'Apple Health & Health Connect · preview',go:'/settings/connections'})}${row({icon:'share',t:'Story studio',s:'Create a PIVOT-branded image',go:'/share/story'})}</section>`);
function healthDetail(h,back){const items=[['Duration',h.min+' min'],...(h.km!=null?[['Distance',h.km+' km']]:[]),...(h.kcal!=null?[['Active energy',h.kcal+' kcal']]:[]),...(h.heartRate!=null?[['Average heart rate',h.heartRate+' bpm']]:[])];return page(h.name,`<span class="pill">${healthSourceLabel(h)}</span><p class="small mt16">${fDay(new Date(h.date))}</p><div class="p-card mt16">${items.map(([t,s])=>row({t,s})).join('')}</div><p class="note mt16">${h.sample?'Illustrative sample activity. No real health connection. ':''}Only available fields are shown. This activity has no strength set data.</p>${button('storyOpen','Share Story',`data-kind="workout" data-id="${h.id}"`,'p')}`,back);}
const workoutHealthPrevious=ROUTES.find(r=>r.pattern==='/workout/:id').fn;
replaceRoute('/workout/:id',(p,q)=>{const h=HISTORY.find(h=>h.id===p.id);if(h?.kind==='health')return healthDetail(h,'/history');const out=workoutHealthPrevious(p,q),share=h?`<section class="pad mt16">${button('storyOpen','Share Story',`data-kind="workout" data-id="${h.id}"`,'p')}</section>`:'';return typeof out==='string'?out+share:{...out,html:out.html+share};});
const coachHealthPrevious=ROUTES.find(r=>r.pattern==='/coach/athlete/:id/workout/:wid').fn;
replaceRoute('/coach/athlete/:id/workout/:wid',(p,q)=>{const h=historyFor(p.id).find(h=>h.id===p.wid);if(h?.kind==='health'&&scopeOn(p.id,'TRAINING'))return healthDetail(h,'/coach/athlete/'+p.id+'/training').replace(/<button[^>]*data-act="storyOpen"[^>]*>[\s\S]*?<\/button>/,'');return coachHealthPrevious(p,q);});
replaceRoute('/history',()=>page('Workout history',HISTORY.map(h=>row({t:esc(h.name),s:fDay(new Date(h.date))+' · '+h.min+' min · '+healthSourceLabel(h),go:'/workout/'+h.id})).join('')||empty('No workouts yet.'),'/train'));
const healthCalendarPrevious=ROUTES.find(r=>r.pattern==='/calendar').fn;
replaceRoute('/calendar',()=>healthCalendarPrevious()+`<section class="pad"><h2>Imported activity</h2>${HISTORY.filter(h=>h.kind==='health').map(h=>row({t:esc(h.name),s:fDay(new Date(h.date))+' · '+healthSourceLabel(h),go:'/workout/'+h.id})).join('')||empty('No imported activity.')}</section>`);
const healthHomePrevious=ROUTES.find(r=>r.pattern==='/').fn;

const newStory=(kind='workout',id='')=>({kind,id,style:'dark',stats:{duration:true,volume:true,sets:true,distance:true,energy:false,heart:false,body:false,name:false},photo:'',background:null});
function storyOptions(kind){if(kind==='workout')return HISTORY.map(h=>({id:h.id,label:h.name+' · '+fDay(new Date(h.date))}));if(kind==='pr')return Object.entries(recordsFlow()).map(([n,r])=>({id:n,label:n+' · '+r.kg+' kg × '+r.reps}));if(kind==='progress')return W.measurements.map(m=>({id:m.id,label:m.name+' · '+m.date}));return [{id:'sessions',label:'Logged sessions'},{id:'goals',label:'Completed goals'},{id:'volume',label:'Total lifting volume'}];}
function storyModel(d){let title='Your next chapter',kicker='PROGRESS, ONE DAY AT A TIME',stats=[],foot='Logged with PIVOT';const h=HISTORY.find(h=>h.id===d.id);
if(d.kind==='workout'&&h){title=h.name;kicker='SESSION COMPLETE';foot=fDay(new Date(h.date))+' · '+healthSourceLabel(h);if(d.stats.duration)stats.push([h.min+'','MINUTES']);if(h.kind!=='health'&&h.kind!=='cardio'){if(d.stats.volume)stats.push([fmt(h.vol),'VOLUME · KG']);if(d.stats.sets)stats.push([String(h.sets),'SETS']);}if(d.stats.distance&&h.km!=null)stats.push([String(h.km),'DISTANCE · KM']);if(d.stats.energy&&h.kcal!=null)stats.push([String(h.kcal),'ACTIVE KCAL']);if(d.stats.heart&&h.heartRate!=null)stats.push([String(h.heartRate),'AVG HEART RATE']);}
else if(d.kind==='pr'){const r=recordsFlow()[d.id];title=d.id||'Personal best';kicker='BEST LOGGED SET';if(r)stats=[[String(r.kg),'KG'],[String(r.reps),'REPS']];foot='From available PIVOT set logs';}
else if(d.kind==='progress'){const m=W.measurements.find(m=>m.id===d.id);title='Showing up for myself.';kicker='MY PROGRESS';if(m&&d.stats.body)stats=[[String(m.value),m.unit.toUpperCase()+' · '+m.name.toUpperCase()]];foot=m?m.date:'My progress with PIVOT';}
else if(d.kind==='milestone'){kicker='EVERY SESSION COUNTS';if(d.id==='goals'){title='Small wins. Real progress.';stats=[[String((W.goals||[]).filter(g=>g.done).length),'GOALS COMPLETED']];}else if(d.id==='volume'){title='Built, rep by rep.';stats=[[fmt(HISTORY.reduce((n,h)=>n+h.vol,0)),'TOTAL VOLUME · KG']];}else{title='Still showing up.';stats=[[String(HISTORY.length),'SESSIONS LOGGED']];}}
return {title,kicker,stats:stats.slice(0,6),foot,name:d.stats.name?W.profile.name:'',sample:!!h?.sample};}
const storyToggle=(key,label)=>`<button class="chip" data-act="storyToggle" data-key="${key}" aria-pressed="${!!storyDraft.stats[key]}">${storyDraft.stats[key]?'✓ ':''}${label}</button>`;
route('/share/story',()=>{storyDraft=storyDraft||newStory();const d=storyDraft,options=storyOptions(d.kind);if(!options.some(o=>o.id===d.id))d.id=options[0]?.id||'';return {html:page('Story studio',`<div class="p-main-grid"><div class="p-main-col"><div class="p-card"><div class="p-label">MADE TO SHARE</div><h2 class="mt12">Your work. Your story.</h2><p class="note mt12">A 1080 × 1920 card with the PIVOT mark. Choose what appears before sharing.</p><label class="field"><span>Card type</span><select class="input" id="story-kind">${[['workout','Workout'],['pr','Personal best'],['progress','Progress'],['milestone','Milestone']].map(([k,v])=>`<option value="${k}" ${d.kind===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Choose record</span><select class="input" id="story-record">${options.map(o=>`<option value="${esc(o.id)}" ${o.id===d.id?'selected':''}>${esc(o.label)}</option>`).join('')||'<option value="">No recorded data yet</option>'}</select></label><div class="field"><span>Card style</span><div class="chips" style="padding:0">${['dark','light','acid'].map(s=>`<button class="chip" data-act="storyStyle" data-style="${s}" aria-pressed="${d.style===s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div></div><div class="field"><span>Visible information</span><div class="chips" style="padding:0;flex-wrap:wrap">${d.kind==='workout'?[['duration','Duration'],['volume','Volume'],['sets','Sets'],['distance','Distance'],['energy','Calories'],['heart','Heart rate']].map(([k,l])=>storyToggle(k,l)).join(''):d.kind==='progress'?storyToggle('body','Include selected measurement'):''}${storyToggle('name','My name')}</div></div><label class="field"><span>Progress photo · optional, private until you choose it</span><select class="input" id="story-photo"><option value="">No progress photo</option>${W.photos.map(p=>`<option value="${p.id}" ${d.photo===p.id?'selected':''}>${p.date}</option>`).join('')}</select></label><label class="field"><span>Or upload a photo background</span><input class="input" id="story-background" type="file" accept="image/jpeg,image/png,image/webp"></label>${d.photo||d.background?button('storyClearPhoto','Remove photo'):''}<p class="note mt16">Body measurements, heart rate, calories and your name start hidden. A photo is included only after you select one. The exported image contains exactly the preview.</p></div></div><aside class="p-aside"><div class="p-card"><canvas id="story-canvas" width="1080" height="1920" aria-label="PIVOT Story preview" style="width:100%;max-width:360px;aspect-ratio:9/16;border-radius:16px;display:block;margin:auto"></canvas><p id="story-status" class="small mt12" role="status">Preparing your preview…</p><div class="btn-row mt16"><button class="btn p sm" id="story-share" data-act="storyShare" disabled>Share image</button><button class="btn s sm" id="story-save" data-act="storySave" disabled>Save PNG</button></div><p class="note mt12">Choose Instagram if your device offers it. Otherwise save the image, open Instagram, and add it to your Story. Nothing posts automatically.</p></div></aside></div>`,'/profile'),mount:renderStory};});
ACT.storyOpen=t=>{storyDraft=newStory(t.dataset.kind||'workout',t.dataset.id||'');storyFile=null;storyImage=null;go('/share/story');};
ACT.storyToggle=t=>{storyDraft.stats[t.dataset.key]=!storyDraft.stats[t.dataset.key];render();};ACT.storyStyle=t=>{storyDraft.style=t.dataset.style;render();};ACT.storyClearPhoto=()=>{storyDraft.photo='';storyDraft.background=null;storyImage=null;render();};
document.addEventListener('change',e=>{const el=e.target;if(!storyDraft)return;if(el.id==='story-kind'){storyDraft=newStory(el.value);storyImage=null;render();}else if(el.id==='story-record'){storyDraft.id=el.value;render();}else if(el.id==='story-photo'){storyDraft.photo=el.value;storyDraft.background=null;storyImage=null;render();}else if(el.id==='story-background'){const f=el.files?.[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>8*1024*1024)return toast('Choose a JPG, PNG or WebP under 8 MB');const reader=new FileReader();reader.onload=()=>{storyDraft.background=reader.result;storyDraft.photo='';storyImage=null;render();};reader.readAsDataURL(f);}});
function storyText(ctx,text,x,y,maxWidth,size,color,maxLines=3){ctx.fillStyle=color;ctx.font='800 '+size+'px Arial, sans-serif';const words=String(text).split(/\s+/);let line='',lines=[];for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>maxWidth&&line){lines.push(line);line=word;}else line=next;}if(line)lines.push(line);lines=lines.slice(0,maxLines);for(let line of lines){while(ctx.measureText(line).width>maxWidth&&line.length>1)line=line.slice(0,-2);ctx.fillText(line,x,y,maxWidth);y+=size*1.16;}return y;}
function drawStory(canvas,d,img=null){const ctx=canvas.getContext('2d'),m=storyModel(d),light=d.style==='light',acid=d.style==='acid';let bg=light?'#f1f2e9':acid?'#d6ff5f':'#10170f',fg=light||acid?'#13200d':'#f5f6ed',muted=light||acid?'#4e5945':'#b0bba7',accent=light?'#344d1a':acid?'#13200d':'#d6ff5f';canvas.width=1080;canvas.height=1920;ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1920);if(img){const scale=Math.max(1080/img.width,1920/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(1080-w)/2,(1920-h)/2,w,h);const g=ctx.createLinearGradient(0,0,0,1920);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(.35,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,.92)');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);fg='#fff';muted='#d2d9cc';accent='#d6ff5f';}else{ctx.globalAlpha=.08;ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(650,0);ctx.lineTo(1080,0);ctx.lineTo(430,1920);ctx.lineTo(0,1920);ctx.closePath();ctx.fill();ctx.globalAlpha=1;}
ctx.fillStyle=accent;ctx.fillRect(80,182,72,8);storyText(ctx,'PIVOT / YOUR DAILY EDGE',80,240,920,25,fg,1);storyText(ctx,m.kicker,80,720,920,28,accent,2);const end=storyText(ctx,m.title,80,820,920,88,fg,2);let y=Math.max(1100,end+40);m.stats.forEach(([value,label],i)=>{const x=80+(i%2)*470,yy=y+Math.floor(i/2)*160;storyText(ctx,value,x,yy,430,value.length>10?44:68,fg,1);storyText(ctx,label,x,yy+47,430,21,muted,1);});if(!m.stats.length)storyText(ctx,'A little stronger. Every day.',80,1220,900,38,fg,2);if(m.name)storyText(ctx,m.name,80,1530,920,30,fg,1);storyText(ctx,m.foot,80,1580,920,23,muted,2);ctx.strokeStyle=muted;ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(80,1630);ctx.lineTo(1000,1630);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=accent;ctx.beginPath();ctx.moveTo(80,1720);ctx.lineTo(112,1658);ctx.lineTo(137,1658);ctx.lineTo(105,1720);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(120,1720);ctx.lineTo(152,1658);ctx.lineTo(167,1658);ctx.lineTo(135,1720);ctx.closePath();ctx.fill();storyText(ctx,'PIVOT',190,1713,700,56,fg,1);return m;}
async function renderStory(){const rev=++storyRevision;storyFile=null;const c=$('#story-canvas');if(!c)return;$('#story-save').disabled=true;$('#story-share').disabled=true;try{const data=storyDraft.background||W.photos.find(p=>p.id===storyDraft.photo)?.data;let img=null;if(data){img=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=data;});}if(rev!==storyRevision)return;drawStory(c,storyDraft,img);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(rev!==storyRevision)return;if(!blob)throw Error('Image export unavailable');storyFile=new File([blob],'pivot-story.png',{type:'image/png'});$('#story-save').disabled=false;$('#story-share').disabled=false;$('#story-status').textContent='Ready · 1080 × 1920 PNG · PIVOT watermark included';}catch{$('#story-status').textContent='Could not prepare this image. Try removing the photo and preview again.';}}
ACT.storySave=()=>{if(!storyFile)return toast('Wait for the preview to finish');const url=URL.createObjectURL(storyFile),a=document.createElement('a');a.href=url;a.download='pivot-story.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PNG download started');};
ACT.storyShare=async()=>{if(!storyFile)return toast('Wait for the preview to finish');if(!navigator.canShare?.({files:[storyFile]})||!navigator.share){toast('Image sharing is unavailable here. Use Save PNG, then upload it to your Story.');return;}try{await navigator.share({files:[storyFile]});}catch(e){if(e.name!=='AbortError')toast('Sharing could not open. Use Save PNG instead.');}};
ACT.shareSheet=t=>{const h=HISTORY.find(h=>h.name===t.dataset.n);ACT.storyOpen({dataset:{kind:h?'workout':'progress',id:h?.id||''}});};
for(const path of ['/profile','/progress','/achievements']){const prev=ROUTES.find(r=>r.pattern===path).fn;replaceRoute(path,(p,q)=>{const out=prev(p,q),entry=`<section class="pad mt16">${button('storyOpen','Create a Story',`data-kind="${path==='/achievements'?'milestone':path==='/progress'?'progress':'workout'}"`,'p')}</section>`;return typeof out==='string'?out+entry:{...out,html:out.html+entry};});}
persistFlows();render();
