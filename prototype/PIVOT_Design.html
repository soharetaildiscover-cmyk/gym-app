:root{
  --black:#0B0D0C; --carbon:#151816; --graphite:#202421;
  --acid:#D6FF3F; --gold:#E8C760; --bone:#F4F5EF; --steel:#929893; --red:#FF5A4F;
  --bone-2:rgba(244,245,239,.72);
  --line:rgba(244,245,239,.08);
  --line-2:rgba(244,245,239,.14);
  --gutter:20px;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Manrope",system-ui,sans-serif;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--black);color:var(--bone)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
button,a,[data-go],[data-act]{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acid);outline-offset:3px;border-radius:6px}
#app{max-width:430px;margin:0 auto;position:relative;min-height:100dvh}
#view{padding-bottom:calc(var(--nav-h) + 40px + var(--safe-b))}
#view.has-cta{padding-bottom:calc(var(--nav-h) + 110px + var(--safe-b))}
#view.bare{padding-bottom:calc(120px + var(--safe-b))}
#view.bare.no-dock{padding-bottom:40px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
svg.i.xs{width:14px;height:14px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.acid{color:var(--acid)} .gold{color:var(--gold)} .steel{color:var(--steel)} .red{color:var(--red)} .b2{color:var(--bone-2)}
.who{color:var(--gold);font-weight:700}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.k-acid{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--acid)}
.k-acid::before{content:"";width:6px;height:6px;background:currentColor;border-radius:1px;transform:rotate(45deg)}
.k-steel{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--steel)}
.k-steel::before{content:"";width:6px;height:6px;background:currentColor;border-radius:1px;transform:rotate(45deg)}
.k-gold{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.pad{padding:0 var(--gutter)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt40{margin-top:40px}
.muted{font-size:13px;color:var(--steel)}
.small{font-size:12.5px;color:var(--steel)}
.center{text-align:center}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pretty{text-wrap:pretty}

/* ---------- headers ---------- */
.hdr{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:4px;height:calc(56px + var(--safe-t));padding:var(--safe-t) 8px 0;
  background:rgba(11,13,12,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hdr.line{border-bottom:1px solid var(--line)}
.hdr__t{flex:1;min-width:0;font-family:var(--display);font-size:17px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.hdr__t small{display:block;font-family:var(--body);font-size:12px;color:var(--steel);font-weight:600;letter-spacing:0}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;position:relative;color:var(--bone);flex:none}
.ib:active{background:rgba(244,245,239,.08)}
.ib .dot{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--acid);box-shadow:0 0 0 2px var(--black)}
.ib .count{position:absolute;top:6px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acid);color:var(--black);font:800 10.5px/18px var(--body);text-align:center;box-shadow:0 0 0 2px var(--black)}
.big-hdr{padding:calc(18px + var(--safe-t)) var(--gutter) 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.big-hdr h1{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1}
.big-hdr p{font-size:13px;color:var(--steel);font-weight:600;margin-top:6px}
.big-hdr .acts{display:flex;align-items:center;margin-right:-10px}
.page-title{padding:8px var(--gutter) 4px}
.page-title h1{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.page-title p{font-size:13.5px;color:var(--steel);margin-top:6px;font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:22px;padding:0 var(--gutter);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(56px + var(--safe-t));z-index:14;background:rgba(11,13,12,.92);backdrop-filter:blur(16px)}
.tabs.static{position:static;background:none;backdrop-filter:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;height:44px;font-size:14px;font-weight:700;color:var(--steel);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--bone)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acid);border-radius:2px}
.seg{display:inline-flex;padding:3px;border-radius:20px;background:rgba(244,245,239,.07)}
.seg button{height:30px;padding:0 14px;border-radius:15px;font-size:12.5px;font-weight:700;color:var(--steel)}
.seg button[aria-selected=true]{background:var(--bone);color:var(--black)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--gutter);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:700;color:var(--bone-2);box-shadow:inset 0 0 0 1px var(--line-2);white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--bone);color:var(--black);box-shadow:none}
.chip .n{font-family:var(--display);color:var(--steel);font-weight:500}
.chip[aria-pressed=true] .n{color:rgba(11,13,12,.55)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:24px;font-size:15px;font-weight:800;letter-spacing:.01em;transition:transform .1s,opacity .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--acid);color:var(--black)}
.btn.s{box-shadow:inset 0 0 0 1px var(--line-2);color:var(--bone)}
.btn.w{background:var(--bone);color:var(--black)}
.btn.g{color:var(--bone-2);padding:0 12px}
.btn.d{color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,90,79,.35)}
.btn.sm{height:38px;padding:0 15px;font-size:13.5px;border-radius:19px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.link{display:inline-flex;align-items:center;gap:2px;color:var(--bone);font-weight:700;font-size:13px;min-height:40px}
.link.acid{color:var(--acid)}
.send-coach{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 5px;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(244,245,239,.28);color:var(--bone);font-size:13.5px;font-weight:800}
.send-coach.is-sent{box-shadow:none;background:rgba(244,245,239,.07);color:var(--bone-2);pointer-events:none}

/* ---------- avatars ---------- */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--graphite);font:600 14px var(--display);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden}
.av.sm{width:32px;height:32px;font-size:12px}
.av.xs{width:24px;height:24px;font-size:10px}
.av.lg{width:72px;height:72px;font-size:24px}
.av.xl{width:92px;height:92px;font-size:30px}
.av.coach{box-shadow:0 0 0 1.5px var(--gold),0 0 0 3.5px var(--black)}
.av.me{background:#2c3122}
.av svg{width:100%;height:100%;display:block}
.stack{display:flex}
.stack .av{margin-left:-8px;box-shadow:0 0 0 2px var(--black)}
.stack .av:first-child{margin-left:0}
.badge-coach{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--black);background:var(--gold)}

/* ---------- lists ---------- */
.list{list-style:none}
.row{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 0;border-bottom:1px solid var(--line)}
.list.top .row:first-child,.row.top{border-top:1px solid var(--line)}
.row:active{background:rgba(244,245,239,.025)}
.row__ic{width:38px;height:38px;border-radius:50%;background:var(--carbon);display:grid;place-items:center;color:var(--bone-2);flex:none}
.row__ic svg{width:18px;height:18px}
.row__ic.acid{background:rgba(214,255,63,.12);color:var(--acid)}
.row__t{flex:1;min-width:0}
.row__t b{display:block;font-weight:700;font-size:15px}
.row__t span,.row__t p{font-size:13px;color:var(--steel)}
.row__r{font-family:var(--display);font-size:15px;color:var(--bone-2);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.row__r small{display:block;font-family:var(--body);font-size:12px;color:var(--steel)}
.chev{color:var(--steel)}
.sec{margin-top:36px;padding:0 var(--gutter)}
.sec.tight{margin-top:24px}
.sec__h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;min-height:24px}
.sec__h h2{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.sec__h h3{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.015em}

/* ---------- surfaces ---------- */
.surf{background:var(--carbon);border-radius:20px;padding:18px}
.surf.tight{padding:14px 16px}
.hair{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.note{font-size:13px;color:var(--steel);line-height:1.5}
.quote{font-size:15px;color:var(--bone);line-height:1.5}
.callout{padding-left:16px;border-left:2px solid var(--acid)}
.callout.gold{border-left-color:var(--gold)}
.lockbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 24px;color:var(--steel)}
.lockbox b{color:var(--bone);font-family:var(--display);font-weight:500;font-size:18px}
.lockbox .row__ic{width:52px;height:52px}
.empty{padding:28px 0;text-align:center;font-size:14px;color:var(--steel)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stats.two{grid-template-columns:1fr 1fr}
.stat__v{font-family:var(--display);font-size:32px;font-weight:500;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat__v small{font-size:14px;color:var(--steel);letter-spacing:0;margin-left:2px;font-weight:400}
.stat__v.md{font-size:26px}
.stat__l{font-size:12.5px;color:var(--steel);font-weight:600;margin-top:7px}
.bar{height:3px;background:var(--graphite);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--bone)}
.bar i.a{background:var(--acid)}
.bar.thick{height:6px;border-radius:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.grid2 > *{padding:18px 0;border-bottom:1px solid var(--line);min-height:100px}
.grid2 > *:nth-child(odd){padding-right:16px;border-right:1px solid var(--line)}
.grid2 > *:nth-child(even){padding-left:16px}
.tile__l{font-size:12.5px;color:var(--steel);font-weight:700}
.tile__v{font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.tile__v small{font-size:14px;color:var(--steel);letter-spacing:0}
.tile__s{font-size:12.5px;color:var(--steel);margin-top:4px}
svg.spark{display:block;width:100%;height:26px;margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:28px;border-radius:4px 4px 2px 2px;background:var(--graphite)}
.bars i.on{background:var(--bone)}
.bars i.a{background:var(--acid)}
.bars span{font-size:11px;color:var(--steel);font-weight:700}

/* ---------- forms ---------- */
.field{display:block;margin-top:16px}
.field > span{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:8px}
.input{width:100%;height:52px;padding:0 16px;border-radius:14px;background:var(--carbon);box-shadow:inset 0 0 0 1px var(--line);font-size:16px;color:var(--bone)}
.input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--acid)}
textarea.input{height:auto;min-height:96px;padding:14px 16px;resize:none;line-height:1.5}
.input::placeholder{color:rgba(146,152,147,.7)}
.unit-in{position:relative}
.unit-in em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--steel);font-size:14px;font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;height:56px;border-radius:14px;background:var(--carbon);padding:0 6px}
.stepper button{width:44px;height:44px;border-radius:22px;font-size:22px;color:var(--bone)}
.stepper button:active{background:rgba(244,245,239,.08)}
.stepper b{font-family:var(--display);font-size:22px;font-weight:500}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--graphite);position:relative;flex:none;transition:background .15s;box-shadow:inset 0 0 0 1px var(--line-2)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--steel);transition:transform .18s,background .18s}
.toggle[aria-checked=true]{background:var(--acid);box-shadow:none}
.toggle[aria-checked=true]::after{transform:translateX(20px);background:var(--black)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scale button{height:44px;border-radius:12px;background:var(--carbon);font-family:var(--display);font-size:16px;color:var(--bone-2)}
.scale button[aria-pressed=true]{background:var(--bone);color:var(--black)}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:52px;padding:10px 14px;border-radius:14px;background:var(--carbon);text-align:left;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.opt[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--acid)}
.opt small{display:block;font-weight:600;color:var(--steel);font-size:12px}

/* ---------- dock / tab bar ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.dock__in{max-width:430px;margin:0 auto;pointer-events:auto}
.fade{height:30px;background:linear-gradient(180deg,rgba(11,13,12,0),rgba(11,13,12,.92))}
.ctawrap{background:rgba(11,13,12,.94);padding:0 var(--gutter) 12px}
.cta{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 7px 0 22px;width:100%;
  background:var(--acid);color:var(--black);border-radius:27px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta.center{justify-content:center;padding:0 22px}
.cta.live{background:var(--bone)}
.cta__go{width:40px;height:40px;border-radius:50%;background:var(--black);color:var(--acid);display:grid;place-items:center}
.cta.live .cta__go{color:var(--bone)}
.cta__go svg{width:16px;height:16px;fill:currentColor;stroke:none}
.nav{display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(11,13,12,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--steel);font-size:11px;font-weight:700;letter-spacing:.02em;position:relative}
.nav a[aria-current]{color:var(--bone)}
.nav a[aria-current] svg{color:var(--acid)}
.nav a.coachnav[aria-current] svg{color:var(--gold)}
.nav .count{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acid);color:var(--black);font:800 10px/17px var(--body);text-align:center}

/* ---------- sheet / toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s;pointer-events:none}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:100%;max-width:430px;max-height:88dvh;overflow:auto;transform:translate(-50%,100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  background:var(--carbon);border-radius:24px 24px 0 0;padding:10px var(--gutter) calc(24px + var(--safe-b))}
.sheet.show{transform:translate(-50%,0)}
.sheet__grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.02em}
.sheet .input,.sheet .opt,.sheet .stepper,.sheet .scale button{background:var(--graphite)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + var(--safe-b));transform:translate(-50%,12px);opacity:0;z-index:50;
  width:calc(100% - 40px);max-width:390px;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px;border-radius:16px;
  background:var(--graphite);color:var(--bone);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.up{bottom:calc(var(--nav-h) + 92px + var(--safe-b))}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{flex:1}
.toast button{font-weight:800;color:var(--acid);min-height:36px;padding:0 10px}

/* ---------- hero (Home / Train) ---------- */
.hero{position:relative;isolation:isolate;padding:calc(10px + var(--safe-t)) var(--gutter) 0}
.hero__img{position:absolute;inset:0;z-index:-1;overflow:hidden}
.hero__img svg{width:100%;height:100%;display:block}
.hero__img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,12,.97) 0%,rgba(11,13,12,.86) 26%,rgba(11,13,12,.2) 38%,rgba(11,13,12,0) 46%,rgba(11,13,12,.6) 62%,var(--black) 94%)}
.hero.short .hero__img::after{background:linear-gradient(180deg,rgba(11,13,12,.5) 0%,rgba(11,13,12,0) 30%,rgba(11,13,12,.6) 60%,var(--black) 96%)}
.state{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--acid)}
.state::before{content:"";width:6px;height:6px;background:currentColor;border-radius:1px;transform:rotate(45deg)}
.state.done{color:var(--bone-2)} .state.plan{color:var(--steel)}
.state.live::before{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.title{font-family:var(--display);font-weight:700;line-height:.86;letter-spacing:-.055em;margin:14px 0 0 -4px}
.subtitle{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:-.02em;line-height:1.1;margin-top:10px}
.meta{display:flex;gap:14px;margin-top:12px;font-size:14px;color:var(--bone-2);font-weight:600;flex-wrap:wrap}
.meta b{color:var(--bone);font-weight:700}
.meta span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--steel);vertical-align:middle;margin-right:14px}
.coachline{display:flex;gap:12px;align-items:flex-start;margin-top:18px}
.coachline .t{font-size:14px;color:var(--bone-2);line-height:1.35;padding-top:2px}
.coachline .q{font-size:15px;color:var(--bone);margin-top:4px;line-height:1.45;text-wrap:pretty}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);margin:8px -6px 0}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:12px;min-height:58px;-webkit-user-select:none;user-select:none}
.day:active{background:rgba(244,245,239,.06)}
.day__l{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--steel)}
.day__n{font-family:var(--display);font-size:17px;font-weight:500;color:var(--bone-2);width:32px;height:32px;margin:-6px 0 -2px;display:grid;place-items:center;border-radius:50%}
.day__m{width:4px;height:4px;border-radius:50%}
.day.done .day__m{background:var(--bone-2)}
.day.plan .day__m{box-shadow:inset 0 0 0 1px var(--steel)}
.day.rest .day__n{color:rgba(146,152,147,.6)}
.day.today .day__n{color:var(--black);background:var(--acid);font-weight:600}
.day.today .day__l{color:var(--bone)}
.day.today .day__m{opacity:0}
.day.sel:not(.today) .day__n{box-shadow:inset 0 0 0 1.5px var(--bone);color:var(--bone)}
.range{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.range__nav{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--bone-2);margin-left:-12px}
.range__nav .ib{width:36px;height:40px;color:var(--steel)}
.totoday{height:28px;padding:0 11px;margin-left:8px;border-radius:14px;font-size:12px;font-weight:800;color:var(--black);background:var(--acid)}
.month{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;margin:12px -6px 0}
.month .mh{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--steel);text-align:center;padding:6px 0}
.mday{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;font-family:var(--display);font-size:15px;color:var(--bone-2)}
.mday:active{background:rgba(244,245,239,.06)}
.mday span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.mday i{width:4px;height:4px;border-radius:50%}
.mday.done i{background:var(--bone-2)} .mday.plan i{box-shadow:inset 0 0 0 1px var(--steel)} .mday.missed i{background:var(--red)}
.mday.rest{color:rgba(146,152,147,.6)}
.mday.today span{background:var(--acid);color:var(--black);font-weight:600} .mday.today i{opacity:0}
.mday.sel:not(.today) span{box-shadow:inset 0 0 0 1.5px var(--bone);color:var(--bone)}

/* exercises list */
.ex{list-style:none}
.ex li{display:grid;grid-template-columns:30px 1fr auto;align-items:baseline;gap:8px;padding:15px 0;border-top:1px solid var(--line)}
.ex li:last-child{border-bottom:1px solid var(--line)}
.ex li[data-i]{cursor:pointer}
.ex__i{font-family:var(--display);font-size:13px;color:var(--steel);font-variant-numeric:tabular-nums}
.ex__n{font-family:var(--display);font-size:19px;font-weight:500;letter-spacing:-.01em}
.ex__s{font-family:var(--display);font-size:15px;color:var(--bone-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex__s em{font-style:normal;color:var(--steel);font-size:13px;margin-left:6px}
.ex__chg{grid-column:2/4;font-size:12.5px;color:var(--steel);margin-top:-2px}
.ex__chg i{font-style:normal;color:var(--gold);font-weight:700}
.ex__det{grid-column:2/4;display:grid;gap:6px;padding:10px 0 2px;font-size:13.5px;color:var(--bone-2)}
.ex__det div{display:flex;justify-content:space-between}
.ex__det div span:last-child{font-family:var(--display);color:var(--bone);font-variant-numeric:tabular-nums}

/* insight */
.insight{padding-left:16px;border-left:2px solid var(--acid)}
.insight__t{font-family:var(--display);font-size:19px;line-height:1.28;letter-spacing:-.015em;margin-top:10px;text-wrap:pretty}
.insight__a{display:flex;gap:18px;align-items:center;margin-top:10px;flex-wrap:wrap}
.insight__a > button:not(.send-coach){font-size:13px;font-weight:700;color:var(--steel);min-height:40px}
.prog{display:flex;align-items:flex-end;gap:16px;margin-top:14px}
.prog__v{font-family:var(--display);font-size:38px;font-weight:500;line-height:1;letter-spacing:-.04em}
.prog__u{font-size:14px;color:var(--bone-2);font-weight:600;margin-left:4px}
.prog__l{font-size:12px;color:var(--steel);font-weight:600;margin-top:6px}

/* due reminder */
.due{padding:16px 16px 12px;border-radius:20px;background:var(--carbon)}
.done-row{display:flex;align-items:center;gap:12px;min-height:44px}
.done-row .ok{width:40px;height:40px;border-radius:50%;background:var(--acid);color:var(--black);display:grid;place-items:center;flex:none;font-weight:800}
.done-row .ok.mute{background:var(--graphite);color:var(--bone-2)}
.done-row > div{flex:1;font-size:13.5px;color:var(--bone-2)}
.done-row > div b{display:block;color:var(--bone);font-family:var(--display);font-weight:500;font-size:17px}
.done-row button{font-size:13px;font-weight:800;color:var(--acid);min-height:44px;padding:0 4px}

/* tick */
.tick{width:44px;height:44px;display:grid;place-items:center;margin-right:-10px;color:var(--steel);flex:none}
.tick span{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
.tick.on{color:var(--acid)} .tick.on span{background:var(--acid)}
.tick.on span::after{content:"";width:9px;height:5px;border-left:2px solid var(--black);border-bottom:2px solid var(--black);transform:translateY(-1px) rotate(-45deg)}

/* ---------- logger ---------- */
.lg-top{position:sticky;top:0;z-index:15;background:rgba(11,13,12,.92);backdrop-filter:blur(16px);padding:calc(8px + var(--safe-t)) 8px 10px;border-bottom:1px solid var(--line)}
.lg-time{font-family:var(--display);font-size:30px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lg-sum{display:flex;gap:16px;font-size:12.5px;color:var(--steel);font-weight:700}
.lg-sum b{color:var(--bone);font-family:var(--display);font-weight:500;font-size:14px}
.lg-ex{padding:22px var(--gutter) 6px;border-bottom:1px solid var(--line)}
.lg-ex h3{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.015em}
.sets{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
.sets th{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--steel);text-align:center;padding:6px 0}
.sets th:first-child,.sets td:first-child{text-align:left;width:36px}
.sets td{text-align:center;padding:5px 2px;font-family:var(--display);font-size:16px}
.sets td.prev button{color:var(--steel);font-size:13px;font-weight:700;min-height:40px;padding:0 4px;border-radius:8px}
.sets td.prev button:active{background:rgba(244,245,239,.08)}
.sets tr.flash input{box-shadow:inset 0 0 0 1.5px var(--acid)}
.sets td.prev{color:var(--steel);font-size:13px;font-family:var(--body);font-weight:600}
.sets input{width:64px;height:40px;border-radius:10px;background:var(--carbon);text-align:center;font-family:var(--display);font-size:17px;color:var(--bone)}
.sets input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--acid)}
.sets tr.ok td{color:var(--bone)}
.sets tr.ok input{background:rgba(214,255,63,.1);color:var(--acid)}
.setok{width:40px;height:40px;border-radius:12px;background:var(--carbon);display:grid;place-items:center;color:var(--steel);margin-left:auto}
.setok.on{background:var(--acid);color:var(--black)}
.rest-bar{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 18px;border-radius:28px;background:var(--bone);color:var(--black);margin:0 var(--gutter) 12px;font-weight:800}
.rest-bar .num{font-size:20px}

/* ---------- feed ---------- */
.post{padding:20px var(--gutter);border-bottom:1px solid var(--line)}
.post__h{display:flex;align-items:center;gap:12px}
.post__h b{font-weight:800;font-size:14.5px}
.post__h span{font-size:12.5px;color:var(--steel)}
.post__title{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:14px}
.post__txt{margin-top:8px;font-size:15px;color:var(--bone);line-height:1.5}
.post__m{display:flex;gap:26px;margin-top:14px}
.post__m div span{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--steel)}
.post__m div b{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.02em}
.post__ex{margin-top:12px;font-size:13.5px;color:var(--bone-2)}
.post__a{display:flex;align-items:center;gap:4px;margin:12px 0 -10px -10px}
.post__a button{height:42px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--bone-2);font-size:13.5px;font-weight:700;border-radius:21px}
.post__a button.on{color:var(--acid)}
.post__a button.on svg{fill:currentColor}
.post__a .sp{flex:1}
.media{margin-top:14px;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:var(--graphite);position:relative}
.media svg{width:100%;height:100%;display:block}
.cmt{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cmt.reply{padding-left:44px}
.cmt b{font-size:13.5px;font-weight:800}
.cmt p{font-size:14.5px;margin-top:2px}
.cmt .a{display:flex;gap:16px;margin-top:4px;font-size:12.5px;color:var(--steel);font-weight:700}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:10px var(--gutter) calc(10px + var(--safe-b));background:rgba(11,13,12,.96);border-top:1px solid var(--line)}
.composer .input{height:44px;border-radius:22px}
.composer .sendb{width:44px;height:44px;border-radius:50%;background:var(--acid);color:var(--black);display:grid;place-items:center;flex:none}

/* workout block in posts */
.wblock{margin-top:14px;padding:16px;border-radius:18px;background:var(--carbon)}
.wrow{display:grid;grid-template-columns:1fr auto 70px;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.wrow:first-child{border-top:0}
.wrow b{font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.wrow em{font-style:normal;text-align:right;color:var(--steel);font-family:var(--display);font-size:13.5px}
.savew{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line-2);text-align:left;color:var(--bone)}
.savew b{display:block;font-size:14px;font-weight:800}
.savew small{display:block;font-size:12px;color:var(--steel)}
.savew.on{box-shadow:inset 0 0 0 1px rgba(214,255,63,.4);color:var(--acid)}
.cref{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border-radius:8px;background:var(--carbon);font-size:12px;font-weight:700;color:var(--bone-2)}
/* ---------- chat ---------- */
.chat{padding:8px var(--gutter) 16px;display:flex;flex-direction:column;gap:6px}
.chat .day-sep{text-align:center;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--steel);margin:14px 0 6px}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4}
.bub small{display:block;font-size:11px;color:var(--steel);margin-top:4px}
.bub.them{background:var(--carbon);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--graphite);align-self:flex-end;border-bottom-right-radius:6px}
.bub.pivot{background:none;box-shadow:inset 0 0 0 1px rgba(214,255,63,.35);align-self:stretch;max-width:none;font-size:14px}
.bub .ref{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:8px;padding:9px 10px;border-radius:12px;background:rgba(244,245,239,.07);font-size:12.5px;font-weight:700;text-align:left;color:var(--bone)}
.bub .ref span{flex:1}
.bub .ref svg:last-child{color:var(--steel)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:0 var(--gutter) 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.chatbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:20;background:rgba(11,13,12,.97);border-top:1px solid var(--line);padding:10px 0 calc(10px + var(--safe-b))}
.chatbar .row2{display:flex;gap:8px;align-items:center;padding:0 var(--gutter)}
.chatbar .input{height:44px;border-radius:22px}

/* ---------- profile ---------- */
.cover{height:150px;position:relative;overflow:hidden}
.cover svg{width:100%;height:100%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,12,.2),var(--black))}
.prof{padding:0 var(--gutter);margin-top:-46px;position:relative}
.prof h1{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:12px;display:flex;align-items:center;gap:10px}
.prof .handle{font-size:13.5px;color:var(--steel);font-weight:600}
.prof .bio{margin-top:10px;font-size:15px;line-height:1.5}
.pstats{display:flex;gap:28px;margin-top:16px}
.pstats b{font-family:var(--display);font-size:20px;font-weight:500;display:block;letter-spacing:-.02em}
.pstats span{font-size:12px;color:var(--steel);font-weight:700}

/* ---------- misc ---------- */
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--steel);font-weight:600}
.kv b{font-family:var(--display);font-weight:500;font-size:15px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:800;letter-spacing:.06em;background:rgba(244,245,239,.08);color:var(--bone-2)}
.pill.acid{background:rgba(214,255,63,.14);color:var(--acid)}
.pill.gold{background:rgba(232,199,96,.14);color:var(--gold)}
.pill.red{background:rgba(255,90,79,.14);color:var(--red)}
.pill.solid{background:var(--acid);color:var(--black)}
.thumb{width:56px;height:56px;border-radius:14px;background:var(--carbon);display:grid;place-items:center;flex:none;color:var(--bone-2);overflow:hidden}
.thumb svg{width:34px;height:34px}
.photo{aspect-ratio:3/4;border-radius:14px;background:var(--carbon);overflow:hidden;position:relative}
.photo svg{width:100%;height:100%}
.photo svg.i{width:26px;height:26px}
.photo span{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:800;color:var(--bone-2)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstep{display:flex;gap:6px;margin:14px 0 4px}
.mstep i{flex:1;height:3px;border-radius:2px;background:var(--graphite)}
.mstep i.on{background:var(--acid)}
.welcome{min-height:100dvh;display:flex;flex-direction:column;position:relative;isolation:isolate}
.welcome .hero__img::after{background:linear-gradient(180deg,rgba(11,13,12,.3),rgba(11,13,12,.1) 30%,rgba(11,13,12,.85) 55%,var(--black) 75%)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.18em}
.brand i{display:inline-block;width:10px;height:10px;background:var(--acid);transform:rotate(45deg);margin-right:10px;vertical-align:middle;border-radius:1px}
.acct{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;background:var(--carbon);text-align:left;margin-top:10px}
.acct:active{background:var(--graphite)}
.acct b{display:block;font-size:15.5px}
.acct span{font-size:13px;color:var(--steel)}
.mode-pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:11px;font-weight:800;letter-spacing:.12em}
.mode-pill.coach{background:rgba(232,199,96,.14);color:var(--gold)}
.dashq{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.dashq .pri{width:6px;align-self:stretch;border-radius:3px;background:var(--graphite);flex:none}
.dashq .pri.hi{background:var(--red)}
.dashq h4{font-family:var(--display);font-size:17px;font-weight:500;letter-spacing:-.01em}
.dashq p{font-size:13.5px;color:var(--bone-2);margin-top:2px}
.dashq .who2{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--steel)}
.cal-day{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cal-day .d{width:44px;text-align:center;flex:none}
.cal-day .d b{display:block;font-family:var(--display);font-size:22px;font-weight:500}
.cal-day .d span{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--steel)}
.tl-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl-item time{width:62px;flex:none;font-size:12px;color:var(--steel);font-weight:700;padding-top:2px}
.tl-item b{font-size:14.5px;font-weight:700;display:block}
.tl-item span{font-size:13px;color:var(--steel)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.mac b{font-family:var(--display);font-size:18px;font-weight:500}
.mac small{color:var(--steel);font-size:12.5px}
.mac span{display:block;font-size:12px;color:var(--steel);font-weight:700;margin-bottom:4px}
.ring-wrap{display:flex;align-items:center;gap:22px}
.hint{font-size:12px;color:var(--steel);text-align:center;margin-top:10px}
/* ---------- PIVOT Intelligence ---------- */
.amb{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;padding:10px 0 2px;font-size:13px;line-height:1.4;color:var(--bone-2);font-weight:600}
.amb > svg:first-child{color:var(--acid);width:9px;height:9px;margin-top:4px;flex:none}
.amb > svg:last-child{color:var(--steel);margin-top:2px;margin-left:auto;flex:none}
.amb span{flex:1}
button.amb:active{opacity:.7}
.auth{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--bone-2);line-height:1.4}
.auth .av{width:24px;height:24px}
.auth__me{width:24px;height:24px;border-radius:50%;background:#2c3122;display:grid;place-items:center;font:600 10px var(--display);flex:none}
.statusline{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--bone-2)}
.statusline.gold{color:var(--gold)} .statusline.acid{color:var(--acid)}
.intel-entry{display:block;width:100%;padding:18px;border-radius:20px;background:linear-gradient(var(--carbon),var(--carbon)) padding-box;box-shadow:inset 0 0 0 1px rgba(214,255,63,.22)}
.intel-entry:active{transform:scale(.99)}
.ins-row{padding:18px 0;border-bottom:1px solid var(--line)}
.ins-row:first-child{padding-top:8px}
.ins-row .av.xs{width:18px;height:18px;margin-right:6px}
.ins-who{display:flex;align-items:center}
.post__h .badge-coach{color:var(--black);font-size:10px}
.today-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.today-row .v{font-family:var(--display);font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.today-row .v small{font-size:13px;color:var(--steel);letter-spacing:0;margin-left:1px}
.today-row .l{font-size:12px;color:var(--steel);font-weight:700;margin-top:6px}
.today-row .v.low{color:var(--bone-2)}
.disclose{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;font-weight:700;color:var(--bone-2)}
.disclose svg{transition:transform .2s}
.disclose[aria-expanded=true] svg{transform:rotate(180deg)}
/* ---------- ASK PIVOT ---------- */
.ask-title{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--acid)}
.ask-title::before{content:"";width:7px;height:7px;background:var(--acid);border-radius:1px;transform:rotate(45deg)}
.ask-ctx{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--carbon);margin-top:4px}
.ask-ctx .eyebrow{display:block;font-size:10px}
.ask-ctx b{display:block;font-family:var(--display);font-weight:500;font-size:17px;margin-top:2px;line-height:1.25}
.ask-empty{padding:28px 0 8px}
.ask-q{margin-top:32px}
.ask-q p{font-family:var(--display);font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.ask-who-q{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.ask-a{margin-top:16px;padding-left:14px;border-left:1px solid rgba(214,255,63,.35)}
.ask-who{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--acid)}
.ask-who svg{width:8px;height:8px}
.ask-text{font-size:16px;line-height:1.55;margin-top:6px;color:var(--bone);text-wrap:pretty}
.ask-reading{font-size:14px;color:var(--steel);margin-top:6px;animation:pulse 1.2s infinite}
.ask-blocks{margin-top:12px}
.ask-b{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45;color:var(--bone-2)}
.ask-b > span{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--steel);padding-top:3px}
.ask-b b.num{color:var(--acid);font-weight:500}
.ask-b .auth{font-size:13.5px}
.ask-ev{margin-top:10px;border-top:1px solid var(--line)}
.ask-evb{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;font-size:13.5px;font-weight:800;color:var(--bone)}
.ask-evb span{flex:1;text-align:left}
.ask-evb svg:first-child{color:var(--acid)}
.ask-evb[aria-expanded=true] svg:last-child{transform:rotate(180deg)}
.ask-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.ask-sugg{margin-top:24px}
.ask-sugg button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border-top:1px solid var(--line);text-align:left;font-size:15.5px;font-weight:600;color:var(--bone)}
.ask-sugg button:last-child{border-bottom:1px solid var(--line)}
.ask-sugg button > svg:first-child{color:var(--acid);width:9px;height:9px}
.ask-sugg button > svg:last-child{color:var(--steel);margin-left:auto}
.ask-sugg button span{flex:1}
.ask-sugg.follow{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-left:14px}
.ask-sugg.follow button{width:auto;min-height:36px;padding:0 14px;border:0;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:13.5px}
.ask-sugg.follow button > svg{display:none}
.ask-bar .input{background:var(--carbon)}
.ask-send{background:var(--acid);color:var(--black)}
.ask-link{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:13.5px;font-weight:800;color:var(--bone)}
.ask-link > svg:first-child{color:var(--acid);width:9px;height:9px}
.ask-link > svg:last-child{color:var(--steel)}
.ask-entry{display:block;width:100%;text-align:left;padding:18px;border-radius:20px;background:var(--carbon);box-shadow:inset 0 0 0 1px var(--line-2)}
.ask-entry:active{transform:scale(.99)}
.ask-entry .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-family:var(--display);font-size:18px;color:var(--steel);line-height:1.3}
.ask-entry .go{width:40px;height:40px;border-radius:50%;background:var(--acid);color:var(--black);display:grid;place-items:center;flex:none}
/* ---------- AI FOOD SCAN ---------- */
.cam{min-height:100dvh;display:flex;flex-direction:column;background:#000}
.cam__view{position:relative;aspect-ratio:3/4;overflow:hidden;background:#000}
.cam__view svg{width:100%;height:100%;display:block}

route('/ask', (p, q) => {

function ask(qtext) {
  const A = S.ask; if (!qtext.trim()) return;

  render();
  setTimeout(() => { m.pending = false; m.a = a; m.evOpen = !!a.evOpen; A.topic = a.topic || A.topic; if (location.hash === '#/ask') render(); }, 750);
}

/* nutrition per 100 g — the only source for calorie/macro math (code calculates) */
const FOODDB = {
  'Grilled chicken breast': [165, 31, 0, 3.6], 'White rice': [130, 2.7, 28, 0.3], 'Mixed vegetables': [65, 2.9, 13, 0.3], 'Olive oil': [884, 0, 0, 100],
  'Koshary (rice, lentils, pasta)': [150, 5.5, 28, 1.6], 'Tomato sauce': [55, 1.5, 9, 1.4], 'Fried onions': [420, 4, 40, 26], 'Chickpeas': [164, 8.9, 27, 2.6],
  'Brown rice': [112, 2.3, 24, 0.8], 'Beef mince': [250, 26, 0, 15], 'Salmon': [208, 20, 0, 13], 'Potato': [77, 2, 17, 0.1], 'Greek yogurt': [92, 10, 3.6, 4], 'Eggs': [155, 13, 1.1, 11],
};
const calcItem = it => { const d = FOODDB[it.food] || [0, 0, 0, 0], k = it.g / 100; return { kcal: Math.round(d[0] * k), p: Math.round(d[1] * k), c: Math.round(d[2] * k), f: Math.round(d[3] * k) }; };
const calcTotal = items => items.reduce((a, it) => { const n = calcItem(it); return { kcal: a.kcal + n.kcal, p: a.p + n.p, c: a.c + n.c, f: a.f + n.f }; }, { kcal: 0, p: 0, c: 0, f: 0 });

/* seeded recognition results (stand-in for the vision service) */

  chicken: { name: 'Grilled chicken plate', items: [

  koshary: { name: 'Koshary', items: [
    { food: 'Koshary (rice, lentils, pasta)', g: 350, conf: 'medium', x: 46, y: 50, why: 'Bowl depth is hard to judge from above.' },
    { food: 'Tomato sauce', g: 80, conf: 'low', x: 62, y: 38, why: 'Sauce amount is uncertain — check the quantity.' },
    { food: 'Fried onions', g: 20, conf: 'medium', x: 36, y: 34 }] },

    const smp = SCAN_SAMPLES[S.scan.sample];

  setTimeout(tick, 650);
};

  const markers = s.items.filter(i => i.x).map((i, k) => `<g transform="translate(${i.x * 4} ${i.y * 4})"><circle r="15" fill="${i.conf === 'low' ? '#FF5A4F' : '#0B0D0C'}" stroke="#F4F5EF" stroke-width="2"/><text y="5" text-anchor="middle" font-family="Space Grotesk" font-size="15" font-weight="600" fill="#F4F5EF">${s.items.indexOf(i) + 1}</text></g>`).join('');
  return { html: `${hdr(s.editId ? 'Edit meal' : 'Review scan', { fb: '/food', right: `<button class="btn g sm" data-act="scanRetake">Retake</button>` })}
    <div class="pad"><div class="scan-photo">${mealPhoto(s.sample, { markers })}</div></div>
    <section class="pad mt16"><div class="between"><span class="pill">${ic('mark', 'xs')}&nbsp;AI ESTIMATE</span>${edited ? '<span class="small" style="font-weight:700">Edited by you</span>' : ''}</div>
      <input class="scan-name" value="${esc(s.name || 'Meal')}" aria-label="Meal name" onchange="S.scan.name=this.value">
      <div class="scan-tot"><div><b class="num">${fmt(tot.kcal)}</b><span>kcal</span></div><div><b class="num acid">${tot.p}</b><span>g protein</span></div><div><b class="num">${tot.c}</b><span>g carbs</span></div><div><b class="num">${tot.f}</b><span>g fat</span></div></div>
      <p class="note mt8">${low ? `<span class="red" style="font-weight:700">${low} item${low > 1 ? 's' : ''} to check.</span> ` : ''}Check portions before saving — estimates aren’t exact.</p></section>
    <section class="sec tight"><div class="sec__h"><h2>${s.items.length} foods detected</h2><button class="link acid" data-act="scanAddItem">${ic('plus', 'xs')} Add item</button></div>
      <div class="list top">${s.items.map((it, k) => { const n = calcItem(it), cf = CONF[it.conf || 'high']; return `<div class="scan-item ${it.conf === 'low' ? 'low' : ''}" data-act="scanEdit" data-k="${k}" role="button" tabindex="0">
        <span class="scan-n">${k + 1}</span><div class="grow"><b>${it.food}</b><div class="small"><span class="num" style="color:var(--bone)">~${it.g} g</span> · ${n.kcal} kcal · ${n.p} g protein</div>
        <div class="small ${cf[1]}" style="font-weight:700;margin-top:2px">${it.conf === 'low' ? ic('bolt', 'xs') + ' ' : ''}${it.added ? 'Added by you' : it.changed ? 'Changed by you' : cf[0]}</div>${it.conf === 'low' && it.why && !it.changed ? `<div class="small" style="margin-top:2px">${it.why}</div>` : ''}</div>
        <span class="link" style="flex:none">Edit</span></div>`; }).join('')}</div></section>
    <section class="sec tight"><div class="sec__h"><h2>${s.fromCtx || s.editId ? 'Adding to' : 'Add to'}</h2></div>
      ${s.fromCtx && !S.ui.scanTypeOpen ? `<div class="between"><b class="num" style="font-size:18px;font-weight:500">${s.type}</b><button class="link" data-act="scanTypeOpen">Change</button></div>`
      : `<div class="chips" style="padding:0">${['Breakfast', 'Lunch', 'Dinner', 'Snack'].map(x => `<button class="chip" data-act="scanType" data-v="${x}" aria-pressed="${s.type === x}">${x}</button>`).join('')}</div>`}</section>
    <p class="note pad mt24">PIVOT calculates totals from each food and portion. What you confirm is what counts.</p>`,
    cta: `<button class="cta center" ${s.type && s.items.length ? 'data-act="scanConfirm"' : 'disabled style="opacity:.45"'}><span>${!s.items.length ? 'ADD AT LEAST ONE FOOD' : s.type ? `${s.editId ? 'SAVE' : 'ADD TO'} ${s.type.toUpperCase()} · ${fmt(tot.kcal)} KCAL` : 'CHOOSE A MEAL'}</span></button>` };
}, { bare: true });
ACT.scanType = t => { S.scan.type = t.dataset.v; S.ui.scanTypeOpen = false; render(); };
ACT.scanTypeOpen = () => { S.ui.scanTypeOpen = true; render(); };

/* edit one item */
ACT.scanEdit = t => {
  const k = +t.dataset.k, it = S.scan.items[k];
  const sizes = [['Small', 0.7], ['Medium', 1], ['Large', 1.35]];
  sheet(`<div class="between"><h2>${it.food}</h2><span class="small">${CONF[it.conf || 'high'][0]}</span></div>
    <div class="field"><span>Food</span><button class="opt" style="width:100%" data-act="scanChangeFood" data-k="${k}">${ic('swap', 's')}<div class="grow"><b>${it.food}</b><small>Change food</small></div></button></div>
    <div class="field"><span>Portion</span><div class="chips" style="padding:0">${sizes.map(([l, m]) => `<button class="chip" data-act="scanSize" data-k="${k}" data-m="${m}" aria-pressed="${Math.round((S.scan.detected[k] || it).g * m / 5) * 5 === it.g}">${l}</button>`).join('')}</div></div>
    <div class="field"><span>Amount</span><div class="stepper"><button data-act="scanG" data-k="${k}" data-d="-10" aria-label="Less">−</button><div class="center"><b id="sg">${it.g}</b><b style="font-size:15px;color:var(--steel)"> g</b></div><button data-act="scanG" data-k="${k}" data-d="10" aria-label="More">+</button></div>
      <div class="flex mt8" style="gap:8px"><span class="small">Quantity</span>${[0.5, 1, 2].map(q => `<button class="chip" style="height:30px" data-act="scanQty" data-k="${k}" data-q="${q}">×${q}</button>`).join('')}</div></div>
    <div class="kv mt16" id="sn"><span>This item</span><b>${calcItem(it).kcal} kcal · ${calcItem(it).p} g protein</b></div>
    <div class="btn-row mt24"><button class="btn d" data-act="scanRemove" data-k="${k}">Remove</button><button class="btn p" data-act="scanItemDone">Done</button></div>`);
};
const markChanged = k => { const it = S.scan.items[k]; it.changed = true; it.conf = 'high'; };
const refreshItemSheet = k => { const it = S.scan.items[k], n = calcItem(it); const g = $('#sg'); if (g) g.textContent = it.g; const sn = $('#sn'); if (sn) sn.innerHTML = `<span>This item</span><b>${n.kcal} kcal · ${n.p} g protein</b>`; };
ACT.scanG = t => { const k = +t.dataset.k, it = S.scan.items[k]; it.g = Math.max(5, it.g + +t.dataset.d); markChanged(k); refreshItemSheet(k); };
ACT.scanSize = t => { const k = +t.dataset.k, it = S.scan.items[k], base = (S.scan.detected[k] || it).g; it.g = Math.round(base * +t.dataset.m / 5) * 5; markChanged(k); refreshItemSheet(k); $$('[data-act=scanSize]').forEach(b => b.setAttribute('aria-pressed', b === t)); };
ACT.scanQty = t => { const k = +t.dataset.k, it = S.scan.items[k], base = (S.scan.detected[k] || it).g; it.g = Math.round(base * +t.dataset.q); markChanged(k); refreshItemSheet(k); };
ACT.scanItemDone = () => { closeSheet(); render(); };
ACT.scanRemove = t => { const k = +t.dataset.k, it = S.scan.items.splice(k, 1)[0]; closeSheet(); render(); toast(`${it.food} removed`, () => { S.scan.items.splice(k, 0, it); render(); }); };
ACT.scanChangeFood = t => { const k = t.dataset.k; sheet(`<h2>${k === 'new' ? 'Add item' : 'Change food'}</h2><input class="input mt16" placeholder="Search foods" oninput="document.querySelectorAll('[data-fd]').forEach(r=>r.hidden=!r.dataset.fd.toLowerCase().includes(this.value.toLowerCase()))">
  <div class="list top mt12">${Object.entries(FOODDB).map(([n, d]) => `<div class="row" data-fd="${n}" data-act="scanPickFood" data-k="${k}" data-n="${n}" role="button" tabindex="0"><div class="row__t"><b>${n}</b><span>${d[0]} kcal · ${d[1]} g protein per 100 g</span></div>${ic('plus', 's chev')}</div>`).join('')}</div>`); };
ACT.scanAddItem = () => ACT.scanChangeFood({ dataset: { k: 'new' } });
ACT.scanPickFood = t => {
  const k = t.dataset.k;
  if (k === 'new') { S.scan.items.push({ food: t.dataset.n, g: 100, conf: 'high', added: true }); closeSheet(); render(); ACT.scanEdit({ dataset: { k: S.scan.items.length - 1 } }); }
  else { const it = S.scan.items[+k]; it.food = t.dataset.n; markChanged(+k); closeSheet(); render(); ACT.scanEdit({ dataset: { k } }); }
};

/* confirm — the only place a scan becomes a meal */
ACT.scanConfirm = () => {
  const s = S.scan, tot = calcTotal(s.items);
  const items = s.items.map(i => ({ food: i.food, g: i.g, conf: i.conf, changed: !!i.changed, added: !!i.added }));
  if (s.editId) {
    const m = S.meals.find(x => x.id === s.editId); Object.assign(m, { name: s.name, type: s.type, items, ...tot, edited: true });
    S.scan = null; go('/food/meal/' + m.id); toast('Meal updated · totals recalculated'); return;
  }
  const m = { id: 'm' + Date.now(), type: s.type, date: iso(TODAY), name: s.name || 'Meal', ...tot, time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), source: 'scan', photo: s.sample, items, detected: s.detected.map(i => ({ food: i.food, g: i.g, conf: i.conf })), detectedTot: calcTotal(s.detected), edited: items.some(i => i.changed || i.added) || items.length !== s.detected.length };
  S.meals.push(m); S.ui.mealType = s.type; S.ui.foodDay = iso(TODAY); S.lastScan = m.id; S.scan = null;
  go('/food'); toast(`${m.name} added to ${m.type.toLowerCase()} · ${fmt(m.kcal)} kcal`, () => { S.meals = S.meals.filter(x => x !== m); S.lastScan = null; render(); });
};

/* future AI tools — entry points only, honestly labelled */
const aiSoon = (icon, title, desc) => `<div class="row ai-soon"><div class="row__ic">${ic(icon)}</div><div class="row__t"><b>${title}</b><span>${desc}</span></div><span class="pill">SOON</span></div>`;

/* ============ athlete: Home + Train ============ */
const titleSize = t => t.length <= 4 ? 96 : t.length <= 6 ? 84 : t.length <= 7 ? 76 : 60;

function weekStrip() {
  const start = addDays(WEEK0, (S.ui.weekOff || 0) * 7), end = addDays(start, 6), sel = S.ui.sel || TODAY;
  const lbl = start.getMonth() === end.getMonth() ? `${start.getDate()} – ${end.getDate()} ${MON[end.getMonth()]}` : `${start.getDate()} ${MON[start.getMonth()]} – ${end.getDate()} ${MON[end.getMonth()]}`;
  const isToday = sameDay(sel, TODAY) && !(S.ui.weekOff || 0);
  if (S.ui.homeView === 'month') {
    const y = sel.getFullYear(), m = sel.getMonth(), first = new Date(y, m, 1), n = new Date(y, m + 1, 0).getDate();
    let g = ['SAT', 'SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI'].map(x => `<div class="mh">${x}</div>`).join('') + '<div></div>'.repeat((first.getDay() + 1) % 7);
    for (let i = 1; i <= n; i++) { const d = new Date(y, m, i), k = kindOf(d); g += `<button class="mday ${k}${sameDay(d, sel) ? ' sel' : ''}" data-act="pickDay" data-d="${iso(d)}" aria-label="${fDay(d)}"><span>${i}</span><i></i></button>`; }
    return `<div class="range"><div class="range__nav"><button class="ib" data-act="monthShift" data-n="-1" aria-label="Previous month">${ic('back', 's')}</button><span>${MONTHS[m]} ${y}</span><button class="ib" data-act="monthShift" data-n="1" aria-label="Next month">${ic('chev', 's')}</button>${isToday ? '' : '<button class="totoday" data-act="toToday">Today</button>'}</div>
      <div class="seg" role="tablist"><button data-act="homeView" data-v="week" aria-selected="false">Week</button><button data-act="homeView" data-v="month" aria-selected="true">Month</button></div></div><div class="month">${g}</div>`;
  }
  return `<div class="range"><div class="range__nav"><button class="ib" data-act="weekShift" data-n="-1" aria-label="Previous week">${ic('back', 's')}</button><span>${lbl}</span><button class="ib" data-act="weekShift" data-n="1" aria-label="Next week">${ic('chev', 's')}</button>${isToday ? '' : '<button class="totoday" data-act="toToday">Today</button>'}</div>
    <div class="seg" role="tablist"><button data-act="homeView" data-v="week" aria-selected="true">Week</button><button data-act="homeView" data-v="month" aria-selected="false">Month</button></div></div>
    <nav class="week" id="week">${Array.from({ length: 7 }, (_, i) => { const d = addDays(start, i), k = kindOf(d); return `<button class="day ${k}${sameDay(d, sel) ? ' sel' : ''}" data-act="pickDay" data-d="${iso(d)}" aria-label="${fDay(d)}${dayPlan(d) ? ', ' + esc(dayPlan(d).name) : ', rest'}"><span class="day__l">${DAYS[d.getDay()].toUpperCase()}</span><span class="day__n">${d.getDate()}</span><span class="day__m"></span></button>`; }).join('')}</nav>`;
}
ACT.pickDay = t => { const d = fromIso(t.dataset.d); S.ui.sel = d; S.ui.weekOff = Math.floor(Math.floor((d - WEEK0) / 864e5) / 7); S.ui.homeView = 'week'; render(); };
ACT.weekShift = t => { S.ui.weekOff = (S.ui.weekOff || 0) + +t.dataset.n; render(); };
ACT.monthShift = t => { const s = S.ui.sel || TODAY; S.ui.sel = new Date(s.getFullYear(), s.getMonth() + +t.dataset.n, 1); render(); };
ACT.toToday = () => { S.ui.sel = TODAY; S.ui.weekOff = 0; render(); };
ACT.homeView = t => { S.ui.homeView = t.dataset.v; render(); };

function exList(plan, kind, expandable = true) {
  return `<ol class="ex">${plan.ex.map((e, i) => `<li ${expandable ? `data-act="exExpand" data-i="${i}" tabindex="0"` : ''}><span class="ex__i">${String(i + 1).padStart(2, '0')}</span><span class="ex__n">${esc(e[0])}</span>
    <span class="ex__s">${e[1]} × ${e[2]}<em>${e[3] ? e[3] + ' kg' : 'BW'}</em>${kind === 'done' ? ' <b class="acid">✓</b>' : ''}</span>
    ${e[4] && kind === 'today' ? `<span class="ex__chg"><i>Omar</i> ${esc(e[4])}</span>` : ''}</li>`).join('')}</ol>`;
}
ACT.exExpand = t => {
  const open = $('.ex__det', t); $$('.ex__det').forEach(x => x.remove()); if (open) return;
  const plan = dayPlan(S.ui.sel || TODAY) || PROGRAM.days[S.ui.planDay || 'Lower A'], e = plan.ex[+t.dataset.i];
  const load = e[3] ? `${e[3]} kg` : 'Bodyweight';
  t.insertAdjacentHTML('beforeend', `<div class="ex__det">${Array.from({ length: e[1] }, (_, i) => `<div><span>Set ${i + 1}${i === 0 ? ' · RIR 2' : ''}</span><span>${load} × ${e[2]}</span></div>`).join('')}<div><span class="steel">Last time</span><span class="steel">${e[3] ? (e[3] - (e[3] > 30 ? 2.5 : 1)) + ' kg' : 'BW'} × ${String(e[2]).split('–')[0]}</span></div><button class="link" data-go="/exercise/${encodeURIComponent(e[0])}">Exercise guide ${ic('chev', 'xs')}</button></div>`);
};

/* ---------------- HOME ---------------- */
route('/', (p, q) => {
  const sel = S.ui.sel || TODAY, k = kindOf(sel), plan = dayPlan(sel);

  if (k === 'today' && S.live) { state = 'IN PROGRESS'; stCls = 'live'; }
  if (k === 'done') { state = `COMPLETED · ${fDay(sel).toUpperCase()}`; stCls = 'done'; }
  if (k === 'plan') { state = `PLANNED · ${fDay(sel).toUpperCase()}`; stCls = 'plan'; }
  if (k === 'rest') { state = sameDay(sel, TODAY) ? 'REST DAY' : `REST DAY · ${fDay(sel).toUpperCase()}`; stCls = 'plan'; }
  const title = plan ? plan.name.toUpperCase() : 'REST';
  const next = !plan && [1, 2, 3, 4, 5, 6].map(n => addDays(sel, n)).find(dayPlan);
  const sets = plan ? plan.ex.reduce((a, e) => a + e[1], 0) : 0;
  const due = S.dueState ? `<div class="done-row"><span class="ok ${S.dueState === 'taken' ? '' : 'mute'}">${S.dueState === 'taken' ? '✓' : S.dueState === 'snooze' ? 'z' : '–'}</span><div><b>${{ taken: 'Creatine taken', snooze: 'Snoozed 30 min', skip: 'Creatine skipped' }[S.dueState]}</b>${{ taken: 'Logged at 11:02 AM · Omar can see this', snooze: 'We’ll remind you again', skip: 'Marked at 11:02 AM' }[S.dueState]}</div><button data-act="due" data-v="">Undo</button></div>`
    : `<div class="flex" style="gap:14px"><div class="row__ic" style="background:var(--graphite);width:40px;height:40px">${ic('pill', 's')}</div><div class="grow"><div class="eyebrow">DUE 9:00 AM</div><div class="num" style="font-size:18px;font-weight:500;margin-top:2px">Creatine · 5 g</div><div class="small"><span class="who">Omar</span> set this reminder</div></div></div>
       <div class="flex mt12" style="gap:4px"><button class="btn p sm" style="flex:1;height:44px" data-act="due" data-v="taken">Taken</button><button class="btn g sm" data-act="due" data-v="snooze">Snooze</button><button class="btn g sm" data-act="due" data-v="skip">Skip</button></div>`;
  const html = `
  <section class="hero" style="min-height:${S.ui.homeView === 'month' ? 840 : 610}px">
    <div class="hero__img">${plateScene(118, 'h')}</div>
    <header class="between" style="align-items:flex-start;padding-top:4px">
      <div><div class="num" style="font-size:22px;font-weight:500">Morning, Hassan</div><div class="small" style="font-weight:600;margin-top:2px">Week 7 of 12 · 1 of 4 sessions</div></div>
      <div class="flex" style="gap:0;margin-right:-8px"><button class="ib" data-go="/messages" aria-label="Messages, 1 unread">${ic('msg')}<span class="dot"></span></button>
        <button class="ib" data-go="/notifications" aria-label="Notifications">${ic('bell')}${S.notifRead ? '' : '<span class="count">3</span>'}</button>
        <button class="ib" data-go="/profile" aria-label="Me"><span class="av sm me">HT</span></button></div>
    </header>
    ${weekStrip()}
    <div style="position:absolute;left:var(--gutter);right:var(--gutter);bottom:18px">
      <div class="state ${stCls}">${state}</div>
      <h1 class="title" style="font-size:${titleSize(title)}px">${title}</h1>
      <div class="subtitle">${plan ? plan.sub : 'Recovery day'}</div>
      <div class="meta">${plan ? (k === 'done' ? `<span><b>${plan.ex.length}</b> exercises</span><span><b>${plan.min - 5}</b> min</span><span><b>5,840</b> kg</span>` : `<span><b>${plan.ex.length}</b> exercises</span><span><b>${sets}</b> sets</span><span>~<b>${plan.min}</b> min</span>`) : next ? `<span>Next: <b>${dayPlan(next).name}</b> · ${fDay(next)}</span>` : ''}</div>
      ${plan ? `<div class="coachline">${av('omar', 'sm')}<div><div class="t">${k === 'today' ? '<span class="who">Omar</span> updated your workout · 18m' : k === 'done' ? 'Program by <span class="who">Omar</span> · logged by you' : 'Program by <span class="who">Omar</span>'}</div>
        ${k === 'today' ? '<div class="q">“Swap deadlift for RDLs and keep it at RPE 7. Leg press is 3 sets now.”</div>' : ''}</div></div>` : ''}
    </div>
  </section>
  <section class="pad">
    ${plan ? exList(plan, k) : '<div class="hair" style="padding:16px 0;color:var(--bone-2)">Nothing planned. Walk 8k steps, 15 min mobility, eat to target and sleep well.</div>'}
    <div class="between" style="padding-top:6px"><span class="small" style="font-weight:600">Week 7 of 12 · Upper / Lower Strength</span><button class="link" data-go="/plan">Program ${ic('chev', 'xs')}</button></div>
  </section>
  ${sameDay(sel, TODAY) ? `
  <section class="pad mt24"><div class="today-row">
      <div data-go="/insights/i3" role="link" tabindex="0"><div class="v low">52</div><div class="l">Readiness</div></div>
      <div data-go="/food" role="link" tabindex="0"><div class="v">${fmt(TARGET.kcal - todayKcal())}</div><div class="l">kcal left</div></div>
      <div data-go="/food" role="link" tabindex="0"><div class="v">${TARGET.p - todayP()}<small>g</small></div><div class="l">protein left</div></div></div>
    ${amb('Readiness is lower than your 2-week baseline (61) — sleep has been short.', '/insights/i3')}</section>
  <section class="pad mt24"><div class="due">${due}</div></section>
  ${openInsights().length ? `<aside class="pad mt40">${insightCompact(openInsights()[0])}</aside>` : ''}
  <section class="sec"><div class="sec__h"><h2>Later today</h2><button class="link" data-go="/reminders">Reminders</button></div>
    <div class="list top">

      <div class="row" data-go="/food" role="link" tabindex="0"><div class="row__ic">${ic('food')}</div><div class="row__t"><b>Dinner</b><span>${todayMeals().length} of 4 meals logged · protein ${todayP()} / ${TARGET.p} g</span></div>${ic('chev', 's chev')}</div>
      <div class="row" data-go="/checkin" role="link" tabindex="0"><div class="row__ic">${ic('check')}</div><div class="row__t"><b>Weekly check-in</b><span>Due Friday · for Omar</span></div>${ic('chev', 's chev')}</div>
    </div></section>
  <section class="sec"><div class="sec__h"><h2>This week</h2><button class="link" data-go="/calendar">Calendar</button></div>
    <div class="between" style="align-items:flex-end"><div class="num" style="font-size:44px;line-height:.9;font-weight:500;letter-spacing:-.05em">1<small style="font-size:18px;color:var(--steel)"> / 4 sessions</small></div>
    <div style="text-align:right;font-size:13px;color:var(--steel);line-height:1.6"><b class="num" style="color:var(--bone);font-size:15px;font-weight:500">5,840 kg</b> volume · <b class="num" style="color:var(--bone);font-size:15px;font-weight:500">1</b> PR</div></div>
    <div class="flex mt12" style="gap:4px">${['on', 'now', '', ''].map(c => `<i style="flex:1;height:4px;border-radius:2px;background:${c === 'on' ? 'var(--bone)' : c === 'now' ? 'var(--acid)' : 'var(--graphite)'}"></i>`).join('')}</div>
    <div class="row mt16 top" data-go="/review" role="link" tabindex="0"><div class="row__t"><b style="display:flex;align-items:center;gap:8px"><span class="acid" style="display:flex">${ic('mark', 'xs')}</span>Weekly PIVOT Review</b><span>Last week: stay the course · next review Sat</span></div>${ic('chev', 's chev')}</div>
  </section>` : ''}`;
  const cta = k === 'today' && plan ? ctaBtn(S.live ? `IN PROGRESS · ${liveTime()}` : 'START WORKOUT', S.live ? '/log' : 'startWorkout', { cls: S.live ? 'live' : '' }) : null;

  <div class="tabs" role="tablist">${A360_TABS.map(([v, l, sc]) => `<button role="tab" data-go="${v === 'message' ? '/coach/messages/' + id : `/coach/athlete/${id}${v === 'overview' ? '' : '/' + v}`}" aria-selected="${v === tab}">${l}${sc && !scopeOn(id, sc) ? ' ' + ic('lock', 'xs') : ''}</button>`).join('')}</div>`;
  const sc = (A360_TABS.find(x => x[0] === tab) || [])[2];

  if (tab === 'nutrition') return head + `<section class="pad mt16"><div class="between"><div><div class="num" style="font-size:24px;font-weight:500">3,200 kcal</div><div class="small">P246 C360 F89 · set by you Sep 5</div></div><button class="btn s sm" data-go="/coach/athlete/${id}/targets">Edit targets</button></div>
    <div class="list top mt16">${[['Today', todayKcal(), `${todayMeals().length} meals · protein ${todayP()}/246 g · in progress`], ['Yesterday', 3290, '4 meals · protein 298/246 g'], ['Sat 3 Oct', 3142, '4 meals · protein 261/246 g'], ['Fri 2 Oct', 3295, '4 meals · protein 261/246 g'], ['Thu 1 Oct', 3384, '4 meals · protein 287/246 g']].map(([d, k, s]) => row({ t: d, s, r: `${fmt(k)}<small>/ 3,200</small>`, go: `/coach/athlete/${id}/day/${d}` })).join('')}</div></section>`;

    <div class="sec__h mt32"><h2>Best lifts</h2></div><div class="list top">${RECORDS.slice(0, 4).map(r => row({ t: r[0], s: r[2], r: r[1] })).join('')}</div></section>`;

    <div class="btn-row mt16"><button class="btn s sm" data-go="/coach/plans/program/ul">Edit program</button><button class="btn s sm" data-go="/coach/athlete/${id}/assign">Change program</button></div></section>

<script>

const PIVOT_KEY='pivot-elevated-v1';

try{const saved=localStorage.getItem('pivot-workflows-v2')?null:JSON.parse(localStorage.getItem(PIVOT_KEY)||'null');if(saved){Object.assign(S,saved.state);if(S.ui.sel)S.ui.sel=new Date(S.ui.sel);HISTORY.splice(0,HISTORY.length,...saved.history.map(h=>({...h,date:new Date(h.date)})));Object.assign(WORKOUT_SETS,saved.workoutSets);}}catch{}
const replaceRoute=(path,fn)=>{const r=ROUTES.find(r=>r.pattern===path);if(r)r.fn=fn;};

const pCardHead=(title,label,path)=>`<div class="p-card-head"><h2>${title}</h2>${path?`<a class="link" href="#${path}">${label||'View all'} ${ic('chev','xs')}</a>`:''}</div>`;
const pMacro=(label,value,target)=>`<div class="p-macro"><span>${label}</span><strong>${Math.round(value)}<small> / ${target>0?target+' g':'not set'}</small></strong><div class="p-progress"><i style="width:${Math.min(100,target>0?value/target*100:0)}%"></i></div></div>`;
const pTotals=ms=>ms.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{kcal:0,p:0,c:0,f:0});
